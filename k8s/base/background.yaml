apiVersion: apps/v1
kind: Deployment
metadata:
  name: ais-worker
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels: { app: ais-worker }
  template:
    metadata:
      labels: { app: ais-worker }
    spec:
      containers:
        - name: ais-worker
          image: ${IMAGE_TAG}
          command: ["node", "dist/worker.js"]
          envFrom:
            - secretRef: { name: ais-secrets }
          env:
            - { name: NODE_ENV, value: production }
          readinessProbe:
            exec:
              command:
                [
                  "node",
                  "-e",
                  "const fs=require('node:fs');try{process.exit(Date.now()-fs.statSync('/tmp/ais-worker-ready').mtimeMs<30000?0:1)}catch{process.exit(1)}",
                ]
            periodSeconds: 5
          startupProbe:
            exec:
              command:
                [
                  "node",
                  "-e",
                  "const fs=require('node:fs');try{process.exit(Date.now()-fs.statSync('/tmp/ais-worker-ready').mtimeMs<30000?0:1)}catch{process.exit(1)}",
                ]
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ais-auth
  namespace: ${NAMESPACE}
spec:
  replicas: 2
  selector:
    matchLabels: { app: ais-auth }
  template:
    metadata:
      labels: { app: ais-auth }
    spec:
      containers:
        - name: ais-auth
          image: ${AUTH_IMAGE_TAG}
          ports:
            - { containerPort: 8000 }
          envFrom:
            - secretRef: { name: ais-secrets }
          readinessProbe:
            httpGet: { path: /auth/health, port: 8000 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ais-auth
  namespace: ${NAMESPACE}
spec:
  selector: { app: ais-auth }
  ports:
    - { port: 8000, targetPort: 8000 }
