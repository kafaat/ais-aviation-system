name: Production Docker Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - Dockerfile.prod
      - auth-service/**
      - package.json
      - pnpm-lock.yaml
      - .npmrc
      - server/_core/**
      - scripts/ci/docker-image-smoke.sh
      - scripts/ci/docker-auth-smoke.sh
      - .github/workflows/docker-image-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Two quick merges to main must not cancel the earlier run and lose its
  # docker-build-evidence artifact; only pull request runs supersede.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build and validate production images (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build, validate and boot the production-only images
        id: images
        run: bash scripts/ci/docker-image-smoke.sh
      - name: Reject high or critical vulnerabilities in the runtime image
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: ais-build-check:runner
          format: json
          output: /tmp/ais-docker-build-evidence/trivy-runner.json
          exit-code: "1"
          severity: "CRITICAL,HIGH"
      - name: Reject high or critical vulnerabilities in the migrator image
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: ais-build-check:migrator
          format: json
          output: /tmp/ais-docker-build-evidence/trivy-migrator.json
          exit-code: "1"
          severity: "CRITICAL,HIGH"
      - name: Build auth service image (no push)
        id: auth_image
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: |
          set -euo pipefail
          docker build --pull --progress=plain --file auth-service/Dockerfile \
            --tag ais-build-check:auth auth-service \
            2>&1 | tee /tmp/ais-docker-build-evidence/build-auth.log
          docker image inspect ais-build-check:auth \
            > /tmp/ais-docker-build-evidence/image-auth.json
      - name: Verify auth service tests and isolated image boot
        if: ${{ !cancelled() && steps.auth_image.outcome == 'success' }}
        run: bash scripts/ci/docker-auth-smoke.sh
      - name: Reject high or critical vulnerabilities in the auth service image
        if: ${{ !cancelled() && steps.auth_image.outcome == 'success' }}
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: ais-build-check:auth
          format: json
          output: /tmp/ais-docker-build-evidence/trivy-auth.json
          exit-code: "1"
          severity: "CRITICAL,HIGH"
      - name: Summarize image security findings
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        env:
          AUTH_BUILD_OUTCOME: ${{ steps.auth_image.outcome }}
        run: |
          set -euo pipefail
          # Do not turn a skipped or failed image scan into an apparent zero.
          if [[ "$AUTH_BUILD_OUTCOME" != "success" ]]; then
            echo "::error::Auth image build did not succeed ($AUTH_BUILD_OUTCOME); auth vulnerability scan was not completed."
            exit 1
          fi
          for target in runner migrator auth; do
            report="/tmp/ais-docker-build-evidence/trivy-$target.json"
            if [[ ! -s "$report" ]]; then
              echo "::error::Missing or empty Trivy report for $target: $report"
              exit 1
            fi
            if ! jq -e '(.Results | type == "array") and (.SchemaVersion == 2)' "$report" >/dev/null; then
              echo "::error::Invalid Trivy JSON report for $target: $report"
              exit 1
            fi
            echo "Image: $target"
            jq -r '.Results[] | .Target as $target | .Vulnerabilities[]? |
              [$target, .PkgPath, .PkgName, .InstalledVersion, .VulnerabilityID, .Severity, .FixedVersion] | @tsv' "$report"
            jq '[.Results[] | .Vulnerabilities[]?] | length' "$report"
          done
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: docker-build-evidence
          path: /tmp/ais-docker-build-evidence/
          retention-days: 14
          if-no-files-found: error
