name: Apply Action SHA Pinning

on:
  push:
    branches:
      - fix/ci-action-sha-pinning-20260908
    paths:
      - .github/workflows/action-pinning-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/ci-action-sha-pinning-20260908
          fetch-depth: 0
      - name: Resolve and pin actions
        run: python3 scripts/ci/pin_actions.py
      - name: Verify policy
        run: |
          python3 scripts/ci/check_action_pins.py
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows scripts/ci
          git commit -m "ci: pin external actions to immutable SHAs"
          git push origin HEAD:fix/ci-action-sha-pinning-20260908
