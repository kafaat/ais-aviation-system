name: Apply Action SHA Pinning
on:
  push:
    branches: [fix/ci-action-sha-pinning-20260908]
    paths: [.github/workflows/action-pinning-apply.yml]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {ref: fix/ci-action-sha-pinning-20260908, fetch-depth: 0}
      - name: Pin every external action and add regression guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          guard = Path('scripts/ci/check_action_pins.py')
          guard.parent.mkdir(parents=True, exist_ok=True)
          guard.write_text(r'''from pathlib import Path
import re, sys
pat = re.compile(r"uses:\s*([^\s#]+)@([^\s#]+)")
bad=[]
for path in sorted(Path('.github/workflows').glob('*.y*ml')):
    for n,line in enumerate(path.read_text().splitlines(),1):
        m=pat.search(line)
        if not m: continue
        target, ref=m.groups()
        if target.startswith('./'): continue
        if not re.fullmatch(r'[0-9a-fA-F]{40}', ref):
            bad.append(f'{path}:{n}: {target}@{ref}')
if bad:
    print('External GitHub Actions must be pinned to full commit SHAs:', file=sys.stderr)
    print('\n'.join(bad), file=sys.stderr)
    raise SystemExit(1)
print('PASS: all external workflow actions are SHA-pinned')
''')

          pg=Path('.github/workflows/production-gates.yml')
          text=pg.read_text()
          anchor='jobs:\n'
          job='''jobs:\n  action-pinning:\n    name: Action SHA Pinning\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Reject mutable external action references\n        run: python3 scripts/ci/check_action_pins.py\n\n'''
          if 'name: Action SHA Pinning' not in text:
              text=text.replace(anchor, job, 1)
              pg.write_text(text)

          pat=re.compile(r'(uses:\s*)([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)(/[A-Za-z0-9_./-]+)?@([^\s#]+)')
          cache={}
          def resolve(repo, ref):
              key=(repo,ref)
              if key in cache: return cache[key]
              if re.fullmatch(r'[0-9a-fA-F]{40}', ref): return ref
              url=f'https://github.com/{repo}.git'
              candidates=[f'refs/tags/{ref}^{{}}', f'refs/tags/{ref}', f'refs/heads/{ref}']
              for candidate in candidates:
                  cp=subprocess.run(['git','ls-remote',url,candidate], text=True, capture_output=True, check=True)
                  lines=[x for x in cp.stdout.splitlines() if x.strip()]
                  if lines:
                      sha=lines[0].split()[0]
                      if re.fullmatch(r'[0-9a-f]{40}', sha):
                          cache[key]=sha
                          return sha
              raise RuntimeError(f'Cannot resolve {repo}@{ref}')
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              src=path.read_text()
              def repl(m):
                  prefix,repo,sub,ref=m.groups()
                  sha=resolve(repo,ref)
                  return f'{prefix}{repo}{sub or ""}@{sha}'
              path.write_text(pat.sub(repl,src))
          for (repo,ref),sha in sorted(cache.items()):
              print(f'{repo}@{ref} -> {sha}')
          PY
      - name: Verify pinning policy
        run: |
          python3 scripts/ci/check_action_pins.py
          git diff --check
      - name: Commit verified pinning
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows scripts/ci/check_action_pins.py
          git commit -m "ci: pin external actions to immutable SHAs"
          git push origin HEAD:fix/ci-action-sha-pinning-20260908
