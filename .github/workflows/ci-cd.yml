name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "release/**"]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22.x"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Prevent concurrent deployments to the same environment
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =============================================================================
  # STAGE 1: Code Quality Checks
  # =============================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier format and verify
        run: |
          pnpm exec prettier --write .
          if [ -n "$(git diff --name-only)" ]; then
            echo "::error::The following files have formatting issues:"
            git diff --name-only
            echo ""
            echo "Run 'pnpm format' locally and commit the changes."
            exit 1
          fi
          echo "All files are properly formatted."

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript check
        run: pnpm run check

  # =============================================================================
  # STAGE 2: Testing
  # =============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: ais_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ptest_password --silent; do
            echo 'Waiting for MySQL...'
            sleep 2
          done

      - name: Run database migrations
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_test
        run: pnpm exec drizzle-kit push --force

      - name: Generate ephemeral JWT signing secret
        shell: bash
        run: |
          set -euo pipefail
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run tests with coverage
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_test
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
          STRIPE_SECRET_KEY: sk_test_mock_key
          STRIPE_WEBHOOK_SECRET: whsec_mock_secret
        run: pnpm run test:coverage

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/
          retention-days: 7

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage Report Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | $(cat coverage/coverage-summary.json | jq -r '.total.lines.pct')% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | $(cat coverage/coverage-summary.json | jq -r '.total.statements.pct')% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | $(cat coverage/coverage-summary.json | jq -r '.total.functions.pct')% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | $(cat coverage/coverage-summary.json | jq -r '.total.branches.pct')% |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not available" >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # STAGE 3: Security Scanning
  # =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level=high || true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Check for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # STAGE 4: E2EE Tests
  # =============================================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 20
    continue-on-error: true # E2E tests are aspirational; don't block the pipeline

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: ais_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")
          echo "version=${PLAYWRIGHT_VERSION}" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ptest_password --silent; do
            echo 'Waiting for MySQL...'
            sleep 2
          done

      - name: Run database migrations
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_test
        run: pnpm exec drizzle-kit push --force

      - name: Setup Python for auth service
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install auth service dependencies
        run: pip install -r auth-service/requirements.txt

      - name: Generate ephemeral JWT signing secret
        shell: bash
        run: |
          set -euo pipefail
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start auth service
        env:
          DATABASE_URL: ysqmal+pymysql://root:test_password@127.0.0.1:3306/ais_test
          PORT: 8000
          DEBUG: true
      run: |
          cd auth-service
          uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/auth-service.log 2>&1 &
          echo "AUTH_PID=$!" >> $GITHUB_ENV
          sleep 5
          curl -sf http://localhost:8000/auth/health || (cat /tmp/auth-service.log && exit 1)
          echo "::notice::Auth service started successfully"

      - name: Seed E2E test users
        run: |
          # Register users via auth service (creates DB rows with passwordHash)
          curl -sf -X POST http://localhost:8000/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"test.user@example.com","password":"TestPassword123!","name":"Test User"}' || true
          curl -sf -X POST http://localhost:8000/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@ais-aviation.com","password":"AdminPassword123!","name":"Admin User"}' || true
          # Promote admin user role
          mysql -h 127.0.0.1 -P 3306 -u root -ptest_password ais_test -e "
            UPDATE users SET role='admin' WHERE email='admin@ais-aviation.com';
          "
          echo "::notice::E2E test users seeded"

      - name: Seed flight data
        env:
          DATABASE_URL: ysql://root:test_password@127.0.0.1:3306/ais_test
        # db:seed runs the script under tsx so its `../drizzle/schema.js`
        # import resolves to the TypeScript source (no compiled .js exists).
        run: pnpm run db:seed

      - name: Build application
        env:
          VITE_APP_ID: ais-aviation-system-test
        run: pnpm run build

      - name: Verify server can start
        env:
          DATABASE_URL: ysql://root:test_password@127.0.0.1:3306/ais_test
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
          STRIPE_SECRET_KEY: sk_test_mock_key
          STRIPE_WEBHOOK_SECRET: whsec_mock_secret
          VITE_APP_ID: ais-aviation-system-test
          OAUTH_SERVER_URL: http://localhost:3000
          OWNER_OPEN_ID: test-owner-open-id
          BUILT_IN_FORGE_API_URL: https://api.example.com
          BUILT_IN_FORGE_API_KEY: test-forge-api-key
          AUTH_SERVICE_URL: http://localhost:8000
        run: |
          # Quick server smoke test: start, wait, check it's alive
          node dist/index.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 10
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "::notice::Server started successfully"
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
          else
            echo "::error::Server failed to start. Logs:"
            cat /tmp/server.log | head -50
            exit 1
          fi

      - name: Run E2E smoke tests
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_test
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
          STRIPE_SECRET_KEY: sk_test_mock_key
          STRIPE_WEBHOOK_SECRET: whsec_mock_secret
          VITE_APP_ID: ais-aviation-system-test
          OAUTH_SERVER_URL: http://localhost:3000
          OWNER_OPEN_ID: test-owner-open-id
          BUILT_IN_FORGE_API_URL: https://api.example.com
          BUILT_IN_FORGE_API_KEY: test-forge-api-key
          AUTH_SERVICE_URL: http://localhost:8000
          CI: true
          E2E_BASE_URL: http://localhost:3000
        run: pnpm run test:e2e:smoke --project=chromium

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload E2E test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/**/*.png
          retention-days: 7

      - name: E2E test summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/results.json ]; then
            TOTAL=$(cat test-results/results.json | jq -r '.stats.total // 0')
            PASSED$=$(cat test-results/results.json | jq -r '.stats.expected // 0')
            FAILED=$(cat test-results/results.json | jq -r '.stats.unexpected // 0')
            SKIPPED=$(cat test-results/results.json | jq -r '.stats.skipped // 0')
