name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "release/**"]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22.x"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Prevent concurrent deployments to the same environment
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =============================================================================
  # STAGE 1: Code Quality Checks
  # =============================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier format and verify
        run: |
          pnpm exec prettier --write .
          if [ -n "$(git diff --name-only)" ]; then
            echo "::error::The following files have formatting issues:"
            git diff --name-only
            echo ""
            echo "Run 'pnpm format' locally and commit the changes."
            exit 1
          fi
          echo "All files are properly formatted."

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript check
        run: pnpm run check

  # =============================================================================
  # STAGE 2: Testing
  # =============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: ais_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ptest_password --silent; do
            echo 'Waiting for MySQL...'
            sleep 2
          done

      - name: Run database migrations
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_test
        run: pnpm run db:migrate
      - name: Verify migrated schema
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_test
        run: pnpm run db:verify

      - name: Run tests with coverage
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_test
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci
          STRIPE_SECRET_KEY: sk_test_mock_key
          STRIPE_WEBHOOK_SECRET: whsec_mock_secret
        run: pnpm run test:coverage

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-coverage
          path: coverage/
          retention-days: 7

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage Report Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | $(cat coverage/coverage-summary.json | jq -r '.total.lines.pct')% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | $(cat coverage/coverage-summary.json | jq -r '.total.statements.pct')% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | $(cat coverage/coverage-summary.json | jq -r '.total.functions.pct')% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | $(cat coverage/coverage-summary.json | jq -r '.total.branches.pct')% |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not available" >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # STAGE 3: Security Scanning
  # =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level=high

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Check for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # STAGE 4: E2E Tests
  # =============================================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: ais_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")
          echo "version=${PLAYWRIGHT_VERSION}" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ptest_password --silent; do
            echo 'Waiting for MySQL...'
            sleep 2
          done

      - name: Run database migrations
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_test
        run: pnpm run db:migrate
      - name: Verify migrated schema
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_test
        run: pnpm run db:verify

      - name: Setup Python for auth service
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install auth service dependencies
        run: pip install -r auth-service/requirements.txt

      - name: Verify auth database URL configuration
        run: python -m unittest discover -s auth-service -p 'test_config.py' -v

      - name: Start auth service
        env:
          DATABASE_URL: mysql+pymysql://root:test_password@127.0.0.1:3306/ais_test
          JWT_SECRET: test-secret-key-for-ci
          PORT: 8000
          DEBUG: true
        run: |
          cd auth-service
          uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/auth-service.log 2>&1 &
          echo "AUTH_PID=$!" >> $GITHUB_ENV
          sleep 5
          curl -sf http://localhost:8000/auth/health || (cat /tmp/auth-service.log && exit 1)
          echo "::notice::Auth service started successfully"

      - name: Seed E2E test users
        run: |
          # Register users via auth service (creates DB rows with passwordHash)
          curl -sf -X POST http://localhost:8000/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"test.user@example.com","password":"TestPassword123!","name":"Test User"}' || true
          curl -sf -X POST http://localhost:8000/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@ais-aviation.com","password":"AdminPassword123!","name":"Admin User"}' || true
          # Promote admin user role
          mysql -h 127.0.0.1 -P 3306 -u root -ptest_password ais_test -e "
            UPDATE users SET role='admin' WHERE email='admin@ais-aviation.com';
          "
          echo "::notice::E2E test users seeded"

      - name: Seed flight data
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_test
        # db:seed runs the script under tsx so its `../drizzle/schema.js`
        # import resolves to the TypeScript source (no compiled .js exists).
        run: pnpm run db:seed

      - name: Build application
        env:
          VITE_APP_ID: ais-aviation-system-test
        run: pnpm run build

      - name: Verify server can start
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_test
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci
          STRIPE_SECRET_KEY: sk_test_mock_key
          STRIPE_WEBHOOK_SECRET: whsec_mock_secret
          VITE_APP_ID: ais-aviation-system-test
          OAUTH_SERVER_URL: http://localhost:3000
          OWNER_OPEN_ID: test-owner-open-id
          BUILT_IN_FORGE_API_URL: https://api.example.com
          BUILT_IN_FORGE_API_KEY: test-forge-api-key
          AUTH_SERVICE_URL: http://localhost:8000
        run: |
          node dist/index.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 10
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "::notice::Server started successfully"
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
          else
            echo "::error::Server failed to start. Logs:"
            cat /tmp/server.log | head -50
            exit 1
          fi

      - name: Run E2E smoke tests
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_test
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci
          STRIPE_SECRET_KEY: sk_test_mock_key
          STRIPE_WEBHOOK_SECRET: whsec_mock_secret
          VITE_APP_ID: ais-aviation-system-test
          OAUTH_SERVER_URL: http://localhost:3000
          OWNER_OPEN_ID: test-owner-open-id
          BUILT_IN_FORGE_API_URL: https://api.example.com
          BUILT_IN_FORGE_API_KEY: test-forge-api-key
          AUTH_SERVICE_URL: http://localhost:8000
          CI: true
          E2E_BASE_URL: http://localhost:3000
        run: pnpm run test:e2e:smoke --project=chromium

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload E2E test screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-screenshots
          path: test-results/**/*.png
          retention-days: 7

      - name: E2E test summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/results.json ]; then
            TOTAL=$(cat test-results/results.json | jq -r '.stats.total // 0')
            PASSED=$(cat test-results/results.json | jq -r '.stats.expected // 0')
            FAILED=$(cat test-results/results.json | jq -r '.stats.unexpected // 0')
            SKIPPED=$(cat test-results/results.json | jq -r '.stats.skipped // 0')
            echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total | ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | ${PASSED} |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | ${FAILED} |" >> $GITHUB_STEP_SUMMARY
            echo "| Skipped | ${SKIPPED} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "E2E test results not available" >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # STAGE 5: Build Application
  # =============================================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha_short: ${{ steps.sha.outputs.sha_short }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Get short SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.sha.outputs.sha_short }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-output
          path: |
            dist/
          retention-days: 7

  # =============================================================================
  # STAGE 5: Build and Push Docker Image
  # =============================================================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ needs.build.outputs.version }}

      - name: Build and push migrator image (for database migrations)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.prod
          target: migrator
          push: true
          pull: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrator:sha-${{ needs.build.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push auth service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          push: true
          pull: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-auth:sha-${{ needs.build.outputs.sha_short }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build.outputs.sha_short }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build.outputs.sha_short }}
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  # =============================================================================
  # STAGE 6: Deploy to Staging
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      DEPLOY_ENV: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-output
          path: dist/

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: "v1.29.0"

      - name: Configure kubectl
        id: staging-kube-config
        run: |
          if [ -z "${{ secrets.STAGING_KUBECONFIG }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::STAGING_KUBECONFIG secret is not set. Skipping Kubernetes deployment."
          else
            mkdir -p ~/.kube
            echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > ~/.kube/config
            chmod 600 ~/.kube/config
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify cluster connectivity
        if: steps.staging-kube-config.outputs.configured == 'true'
        run: |
          if ! kubectl cluster-info --request-timeout=10s 2>/dev/null; then
            echo "::error::Cannot connect to Kubernetes cluster. Check STAGING_KUBECONFIG secret."
            exit 1
          fi

      - name: Create deployment namespace
        if: steps.staging-kube-config.outputs.configured == 'true'
        run: |
          kubectl create namespace ais-staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/Update secrets
        if: steps.staging-kube-config.outputs.configured == 'true'
        run: |
          kubectl create secret generic ais-secrets \
            --namespace=ais-staging \
            --from-literal=DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
            --from-literal=JWT_SECRET="${{ secrets.STAGING_JWT_SECRET }}" \
            --from-literal=CSRF_SECRET="${{ secrets.STAGING_CSRF_SECRET }}" \
            --from-literal=AUTH_SERVICE_URL="http://ais-auth:8000" \
            --from-literal=RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            --from-literal=EMAIL_FROM="${{ vars.EMAIL_FROM }}" \
            --from-literal=OUTBOX_PUBLISH_URL="${{ vars.OUTBOX_PUBLISH_URL }}" \
            --from-literal=OUTBOX_PUBLISH_TOKEN="${{ secrets.OUTBOX_PUBLISH_TOKEN }}" \
            --from-literal=STRIPE_SECRET_KEY="${{ secrets.STAGING_STRIPE_SECRET_KEY }}" \
            --from-literal=STRIPE_WEBHOOK_SECRET="${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}" \
            --from-literal=REDIS_URL="${{ secrets.STAGING_REDIS_URL }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run database migrations
        if: steps.staging-kube-config.outputs.configured == 'true'
        run: |
          kubectl run db-migrate-${{ github.run_id }} \
            --namespace=ais-staging \
            --image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrator:sha-${{ needs.build.outputs.sha_short }} \
            --restart=Never \
            --rm \
            --wait \
            --timeout=300s \
            --env="DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" \
            --command -- npx drizzle-kit migrate

      - name: Deploy to Kubernetes
        if: steps.staging-kube-config.outputs.configured == 'true'
        run: |
          export IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build.outputs.sha_short }}"
          export AUTH_IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-auth:sha-${{ needs.build.outputs.sha_short }}"
          export NAMESPACE="ais-staging"
          export REPLICAS="2"
          envsubst < k8s/base/background.yaml | kubectl apply -f -
          envsubst < k8s/base/deployment.yaml | kubectl apply -f -
          envsubst < k8s/base/service.yaml | kubectl apply -f -
          envsubst < k8s/overlays/staging/ingress.yaml | kubectl apply -f -

      - name: Wait for rollout
        if: steps.staging-kube-config.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/ais-api \
            --namespace=ais-staging \
            --timeout=300s

      - name: Run smoke tests
        if: steps.staging-kube-config.outputs.configured == 'true'
        id: smoke-tests
        run: |
          chmod +x ./scripts/smoke-tests.sh
          ./scripts/smoke-tests.sh ${{ vars.STAGING_URL }}

      - name: Rollback on failure
        if: failure() && steps.staging-kube-config.outputs.configured == 'true' && steps.smoke-tests.outcome == 'failure'
        run: |
          echo "Smoke tests failed, initiating rollback..."
          kubectl rollout undo deployment/ais-api --namespace=ais-staging
          kubectl rollout status deployment/ais-api --namespace=ais-staging --timeout=180s
          echo "Rollback completed"
          exit 1

      - name: Notify deployment success
        if: success() && vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "text": "Staging Deployment Success",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment Successful* :white_check_mark:\n*Commit:* `${{ github.sha }}`\n*Branch:* `${{ github.ref_name }}`\n*URL:* ${{ vars.STAGING_URL }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify deployment failure
        if: failure() && vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "text": "Staging Deployment Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment Failed* :x:\n*Commit:* `${{ github.sha }}`\n*Branch:* `${{ github.ref_name }}`\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # =============================================================================
  # STAGE 7: Deploy to Production (with approval)
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    outputs:
      deployed: ${{ steps.kube-config.outputs.configured }}
    env:
      DEPLOY_ENV: production
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-output
          path: dist/

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: "v1.29.0"

      - name: Configure kubectl
        id: kube-config
        run: |
          if [ -z "${{ secrets.PRODUCTION_KUBECONFIG }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::PRODUCTION_KUBECONFIG secret is not set. Skipping Kubernetes deployment."
          else
            mkdir -p ~/.kube
            echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > ~/.kube/config
            chmod 600 ~/.kube/config
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify cluster connectivity
        if: steps.kube-config.outputs.configured == 'true'
        run: |
          if ! kubectl cluster-info --request-timeout=10s 2>/dev/null; then
            echo "::error::Cannot connect to Kubernetes cluster. Check PRODUCTION_KUBECONFIG secret."
            exit 1
          fi

      - name: Create deployment namespace
        if: steps.kube-config.outputs.configured == 'true'
        run: |
          kubectl create namespace ais-production --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/Update secrets
        if: steps.kube-config.outputs.configured == 'true'
        run: |
          kubectl create secret generic ais-secrets \
            --namespace=ais-production \
            --from-literal=DATABASE_URL="${{ secrets.PRODUCTION_DATABASE_URL }}" \
            --from-literal=JWT_SECRET="${{ secrets.PRODUCTION_JWT_SECRET }}" \
            --from-literal=CSRF_SECRET="${{ secrets.PRODUCTION_CSRF_SECRET }}" \
            --from-literal=AUTH_SERVICE_URL="http://ais-auth:8000" \
            --from-literal=RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            --from-literal=EMAIL_FROM="${{ vars.EMAIL_FROM }}" \
            --from-literal=OUTBOX_PUBLISH_URL="${{ vars.OUTBOX_PUBLISH_URL }}" \
            --from-literal=OUTBOX_PUBLISH_TOKEN="${{ secrets.OUTBOX_PUBLISH_TOKEN }}" \
            --from-literal=STRIPE_SECRET_KEY="${{ secrets.PRODUCTION_STRIPE_SECRET_KEY }}" \
            --from-literal=STRIPE_WEBHOOK_SECRET="${{ secrets.PRODUCTION_STRIPE_WEBHOOK_SECRET }}" \
            --from-literal=REDIS_URL="${{ secrets.PRODUCTION_REDIS_URL }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Persist database backup before migration
        if: steps.kube-config.outputs.configured == 'true' && vars.ENABLE_DB_BACKUP == 'true'
        env:
          BACKUP_PVC: ${{ vars.PRODUCTION_BACKUP_PVC }}
          BACKUP_CREDENTIAL_SECRET: ${{ vars.PRODUCTION_BACKUP_CREDENTIAL_SECRET }}
          BACKUP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/k8s-backup-job.py | kubectl apply -f -
          kubectl wait --namespace=ais-production --for=condition=complete "job/db-backup-$BACKUP_RUN_ID" --timeout=600s
          kubectl logs --namespace=ais-production "job/db-backup-$BACKUP_RUN_ID"

      - name: Run database migrations
        if: steps.kube-config.outputs.configured == 'true'
        run: |
          kubectl run db-migrate-${{ github.run_id }} \
            --namespace=ais-production \
            --image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrator:sha-${{ needs.build.outputs.sha_short }} \
            --restart=Never \
            --rm \
            --wait \
            --timeout=300s \
            --env="DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" \
            --command -- npx drizzle-kit migrate

      - name: Save current deployment for rollback
        if: steps.kube-config.outputs.configured == 'true'
        id: save-current
        run: |
          CURRENT_IMAGE=$(kubectl get deployment ais-api -n ais-production -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "none")
          echo "current_image=${CURRENT_IMAGE}" >> $GITHUB_OUTPUT
          kubectl get deployment ais-api -n ais-production -o yaml > /tmp/current-deployment.yaml 2>/dev/null || true

      - name: Deploy to Kubernetes (Blue-Green)
        if: steps.kube-config.outputs.configured == 'true'
        run: |
          export IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build.outputs.sha_short }}"
          export AUTH_IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-auth:sha-${{ needs.build.outputs.sha_short }}"
          export NAMESPACE="ais-production"
          export REPLICAS="3"
          envsubst < k8s/base/background.yaml | kubectl apply -f -
          envsubst < k8s/base/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/ais-api \
            --namespace=ais-production \
            --timeout=300s

      - name: Run pre-switch health checks
        if: steps.kube-config.outputs.configured == 'true'
        id: health-check
        run: |
          NEW_PODS=$(kubectl get pods -n ais-production -l app=ais-api -o jsonpath='{.items[*].status.podIP}')
          for POD_IP in $NEW_PODS; do
            echo "Checking health of pod at $POD_IP..."
            kubectl run health-check-$(head /dev/urandom | tr -dc a-z0-9 | head -c 6) \
              --rm -i --restart=Never \
              --image=curlimages/curl:latest \
              --namespace=ais-production \
              -- curl -sf http://$POD_IP:3000/api/trpc/health.live || exit 1
          done
          echo "All health checks passed"

      - name: Switch traffic to new deployment
        if: steps.kube-config.outputs.configured == 'true'
        run: |
          export IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build.outputs.sha_short }}"
          export AUTH_IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-auth:sha-${{ needs.build.outputs.sha_short }}"
          export NAMESPACE="ais-production"
          envsubst < k8s/base/service.yaml | kubectl apply -f -
          envsubst < k8s/overlays/production/ingress.yaml | kubectl apply -f -

      - name: Run smoke tests
        if: steps.kube-config.outputs.configured == 'true'
        id: smoke-tests
        run: |
          chmod +x ./scripts/smoke-tests.sh
          ./scripts/smoke-tests.sh ${{ vars.PRODUCTION_URL }}

      - name: Run E2E tests (critical paths)
        if: steps.kube-config.outputs.configured == 'true'
        id: e2e-tests
        run: |
          if [ -f ./scripts/e2e-critical.sh ]; then
            chmod +x ./scripts/e2e-critical.sh
            ./scripts/e2e-critical.sh ${{ vars.PRODUCTION_URL }}
          else
            echo "::error::E2E critical tests script not found"
            exit 1
          fi

      - name: Rollback on failure
        if: failure() && steps.kube-config.outputs.configured == 'true' && (steps.smoke-tests.outcome == 'failure' || steps.health-check.outcome == 'failure' || steps.e2e-tests.outcome == 'failure')
        run: |
          echo "Deployment verification failed, initiating rollback..."
          if [ "${{ steps.save-current.outputs.current_image }}" != "none" ]; then
            kubectl set image deployment/ais-api \
              ais-api=${{ steps.save-current.outputs.current_image }} \
              --namespace=ais-production
            kubectl rollout status deployment/ais-api \
              --namespace=ais-production \
              --timeout=180s
            echo "Rollback completed to: ${{ steps.save-current.outputs.current_image }}"
          else
            kubectl rollout undo deployment/ais-api --namespace=ais-production
            kubectl rollout status deployment/ais-api --namespace=ais-production --timeout=180s
          fi
          exit 1

      - name: Create deployment record
        if: success() && steps.kube-config.outputs.configured == 'true'
        run: |
          echo "Recording successful deployment..."
          kubectl annotate deployment ais-api \
            --namespace=ais-production \
            --overwrite \
            kubernetes.io/change-cause="Deployed ${{ github.sha }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Notify deployment success
        if: success() && vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "text": "Production Deployment Success",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Successful* :rocket:\n*Version:* `${{ needs.build.outputs.version }}`\n*Commit:* `${{ github.sha }}`\n*URL:* ${{ vars.PRODUCTION_URL }}\n*Deployed by:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify deployment failure
        if: failure() && vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "text": "Production Deployment Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Failed* :rotating_light:\n*Commit:* `${{ github.sha }}`\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n*Action Required:* Check logs and verify rollback status"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # =============================================================================
  # STAGE 8: Post-Deployment Monitoring
  # =============================================================================
  post-deploy-monitoring:
    name: Post-Deployment Monitoring
    runs-on: ubuntu-latest
    needs: deploy-production
    if: >-
      success() &&
      needs.deploy-production.outputs.deployed == 'true' &&
      vars.PRODUCTION_URL != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Monitor error rates for 5 minutes
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          echo "Monitoring deployment for anomalies..."
          START_TIME=$(date +%s)
          DURATION=300
          CHECK_INTERVAL=30
          FAILURES=0
          while [ $(($(date +%s) - START_TIME)) -lt $DURATION ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${PRODUCTION_URL%/}/api/rest/health/live" || echo "000")
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "Health check failed with status: $HTTP_STATUS"
              FAILURES=$((FAILURES + 1))
            else
              echo "Health check passed at $(date)"
            fi
            if [ "${FAILURES}" -gt 3 ]; then
              echo "Multiple health check failures detected!"
              exit 1
            fi
            sleep $CHECK_INTERVAL
          done
          echo "Post-deployment monitoring completed successfully"

      - name: Trigger synthetic tests
        if: vars.DATADOG_API_KEY != ''
        run: |
          curl -X POST "https://api.datadoghq.com/api/v1/synthetics/tests/trigger" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ vars.DATADOG_API_KEY }}" \
            -H "DD-APPLICATION-KEY: ${{ vars.DATADOG_APP_KEY }}" \
            -d '{"tests": [{"public_id": "${{ vars.DATADOG_SYNTHETIC_TEST_ID }}"}]}'

  # =============================================================================
  # Docker Compose Deployment (Alternative to K8s)
  # =============================================================================
  deploy-docker-compose:
    name: Deploy via Docker Compose
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOYMENT_METHOD == 'docker-compose'
    environment:
      name: production-docker
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build.outputs.sha_short }}
        run: |
          scp docker-compose.production.yml ${DEPLOY_USER}@${DEPLOY_HOST}:~/ais-aviation/
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} << ENDSSH
            cd ~/ais-aviation
            set -e
            export IMAGE_TAG=${IMAGE_TAG}
            export MIGRATOR_IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrator:sha-${{ needs.build.outputs.sha_short }}
            export AUTH_IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-auth:sha-${{ needs.build.outputs.sha_short }}
            docker compose -f docker-compose.production.yml pull api1 api2 api3 worker auth-service migrator
            docker compose -f docker-compose.production.yml up -d --wait mysql redis
            docker compose -f docker-compose.production.yml run --rm --no-deps migrator
            docker compose -f docker-compose.production.yml up -d --no-deps --wait auth-service
            docker compose -f docker-compose.production.yml up -d --no-deps --wait worker api1 api2 api3
            docker image prune -f
            echo "Deployment completed"
          ENDSSH

      - name: Verify deployment
        run: |
          for i in {1..10}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.PRODUCTION_URL }}/api/trpc/health.ready)
            if [ "$HTTP_STATUS" == "200" ]; then
              echo "Deployment verified successfully"
              exit 0
            fi
            echo "Waiting for service to be ready... (attempt $i)"
            sleep 10
          done
          echo "Deployment verification failed"
          exit 1
