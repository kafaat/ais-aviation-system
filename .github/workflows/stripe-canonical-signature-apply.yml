name: Apply canonical Stripe signature boundary

on:
  push:
    branches: [fix/stripe-webhook-single-authority-20260907]
    paths: [.github/workflows/stripe-canonical-signature-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stripe-webhook-single-authority-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: pnpm/action-setup@v4
      - name: Port signature boundary to canonical handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/webhooks/stripe.ts')
          s = p.read_text()
          old = '''    return res.status(400).json({\n      error: `Signature verification failed: ${errMessage}`,\n      retryable: false,\n    });'''
          new = '''    return res.status(400).json({\n      error: "Signature verification failed",\n      retryable: false,\n    });'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))

          old_test = Path('server/__tests__/legacy-salvage/stripe-webhook-v2-boundaries.test.ts')
          assert old_test.exists()
          old_test.unlink()
          test = Path('server/__tests__/webhooks/stripe-signature-boundary.test.ts')
          test.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst source = readFileSync(\n  new URL("../../webhooks/stripe.ts", import.meta.url),\n  "utf8"\n);\n\ndescribe("Stripe canonical signature boundary", () => {\n  it("keeps provider details in logs but not in the HTTP error", () => {\n    expect(source).toContain('error: "Signature verification failed"');\n    expect(source).toContain('error: errMessage');\n    expect(source).not.toContain('error: `Signature verification failed: ${errMessage}`');\n  });\n});\n''')
          PY
      - name: Install, format and verify
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write server/webhooks/stripe.ts server/__tests__/webhooks/stripe-signature-boundary.test.ts
          pnpm exec prettier --check server/webhooks/stripe.ts server/__tests__/webhooks/stripe-signature-boundary.test.ts
          pnpm check
          pnpm exec vitest run server/__tests__/webhooks/stripe-signature-boundary.test.ts server/__tests__/webhooks/stripe-single-authority.test.ts
      - name: Commit verified correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/webhooks/stripe.ts server/__tests__/webhooks/stripe-signature-boundary.test.ts server/__tests__/legacy-salvage/stripe-webhook-v2-boundaries.test.ts
          git commit -m 'fix(webhooks): preserve signature boundary on canonical handler'
          git push origin HEAD:fix/stripe-webhook-single-authority-20260907
