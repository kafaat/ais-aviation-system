name: AIS Security Review Preflight

on:
  push:
    branches: [fix/ais-security-boundaries-20260907]

permissions:
  contents: write

jobs:
  review:
    if: github.ref == 'refs/heads/fix/ais-security-boundaries-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      JWT_SECRET: security-review-synthetic-test-key
      STRIPE_SECRET_KEY: sk_test_mock_key
      STRIPE_WEBHOOK_SECRET: whsec_mock_secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ais-security-boundaries-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: pnpm/action-setup@v4
      - name: Update the existing booking checkout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('client/src/pages/BookingPage.tsx')
          source = path.read_text()
          replacements = [
              (
                  'const createPayment = trpc.payments.create.useMutation();',
                  'const createCheckout = trpc.payments.createCheckoutSession.useMutation();',
              ),
              (
                  '''      // Process payment
                await createPayment.mutateAsync({
                  bookingId: booking.bookingId,
                  amount: booking.totalAmount,
                  method: "card",
                });''',
                  '''      // Redirect to the provider; creating a booking is not payment proof.
                const checkout = await createCheckout.mutateAsync({
                  bookingId: booking.bookingId,
                  provider: "stripe",
                });
                if (!checkout.url) {
                  throw new Error(t("common.error"));
                }''',
              ),
              (
                  '''      toast.success(t("common.success"));
                navigate(`/my-bookings`);''',
                  '''      // Confirmation is handled only after provider-verified settlement.
                window.location.assign(checkout.url);''',
              ),
          ]
          for old, new in replacements:
              assert source.count(old) == 1, f'Expected exactly one match: {old!r}'
              source = source.replace(old, new)
          source = re.sub(r'\bcreatePayment\b', 'createCheckout', source)
          assert 'trpc.payments.create.useMutation' not in source
          path.write_text(source)
          PY
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed source and tests
        run: |
          pnpm exec prettier --write \
            server/routers/auth.ts \
            server/routers/payments.ts \
            server/routers/refunds.ts \
            server/services/refunds.service.ts \
            server/routers/auth.security.test.ts \
            server/routers/payments.security.test.ts \
            server/routers/refunds.security.test.ts \
            server/services/refunds.security.test.ts \
            server/__tests__/booking-checkout-contract.test.ts \
            client/src/pages/BookingPage.tsx \
            docs/SECURITY_REMEDIATION_2026-09-07.md
          git diff --check
      - name: Commit only to the isolated review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routers/auth.ts server/routers/payments.ts \
            server/routers/refunds.ts server/services/refunds.service.ts \
            server/routers/auth.security.test.ts \
            server/routers/payments.security.test.ts \
            server/routers/refunds.security.test.ts \
            server/services/refunds.security.test.ts \
            server/__tests__/booking-checkout-contract.test.ts \
            client/src/pages/BookingPage.tsx \
            docs/SECURITY_REMEDIATION_2026-09-07.md
          git -c core.hooksPath=/dev/null commit -m "fix(security): route booking checkout through provider and format tests"
          git push origin HEAD:refs/heads/fix/ais-security-boundaries-20260907
          mkdir -p "$RUNNER_TEMP/ais-security-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/ais-security-evidence/tested-sha.txt"
      - name: TypeScript check
        run: |
          set -o pipefail
          pnpm run check 2>&1 | tee "$RUNNER_TEMP/ais-security-evidence/typecheck.log"
      - name: ESLint
        if: success() || failure()
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee "$RUNNER_TEMP/ais-security-evidence/lint.log"
      - name: Security regression tests
        if: success() || failure()
        run: |
          set -o pipefail
          pnpm exec vitest run \
            server/routers/auth.security.test.ts \
            server/routers/payments.security.test.ts \
            server/routers/refunds.security.test.ts \
            server/services/refunds.security.test.ts \
            server/__tests__/booking-checkout-contract.test.ts \
            --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/ais-security-evidence/tests.log"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ais-security-review-${{ github.run_id }}
          path: ${{ runner.temp }}/ais-security-evidence/
          if-no-files-found: warn
          retention-days: 7
