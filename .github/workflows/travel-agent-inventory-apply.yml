name: Apply Travel Agent Inventory Atomicity
on:
  push:
    branches: [fix/travel-agent-inventory-atomicity-20260908]
    paths: [.github/workflows/travel-agent-inventory-apply.yml]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/travel-agent-inventory-atomicity-20260908
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.x'}
      - run: npm install --global pnpm@10.28.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply atomic booking creation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/services/travel-agent.service.ts'); s=p.read_text()
          marker='const log = createServiceLogger("travel-agent");\n'
          helper=marker+'''\nfunction getAffectedRows(result: unknown): number {\n  if (Array.isArray(result)) {\n    const first = result[0];\n    if (first && typeof first === "object" && "affectedRows" in first) {\n      return Number((first as { affectedRows?: number }).affectedRows ?? 0);\n    }\n  }\n  if (result && typeof result === "object" && "rowsAffected" in result) {\n    return Number((result as { rowsAffected?: number }).rowsAffected ?? 0);\n  }\n  return 0;\n}\n'''
          if marker not in s: raise SystemExit('logger marker missing')
          s=s.replace(marker,helper,1)
          start=s.index('export async function createAgentBooking(')
          end=s.index('/**\n * Generate a unique booking reference',start)
          old=s[start:end]
          # Preserve validation/limits before the flight lookup; replace the mutable tail with one transaction.
          split=old.index('  // Get flight details\n')
          prefix=old[:split]
          tail='''  return db.transaction(async tx => {\n    const [flight] = await tx\n      .select()\n      .from(flights)\n      .where(eq(flights.id, input.flightId));\n\n    if (!flight) {\n      throw new TRPCError({ code: "NOT_FOUND", message: "Flight not found" });\n    }\n\n    const seatCount = input.passengers.length;\n    const pricePerSeat =\n      input.cabinClass === "economy"\n        ? flight.economyPrice\n        : flight.businessPrice;\n    const totalAmount = pricePerSeat * seatCount;\n    const commissionRate = parseFloat(String(agent.commissionRate));\n    const commissionAmount = Math.round((totalAmount * commissionRate) / 100);\n    const bookingReference = generateBookingReference();\n    const pnr = generateBookingReference();\n\n    const seatUpdate =\n      input.cabinClass === "economy"\n        ? await tx\n            .update(flights)\n            .set({ economyAvailable: sql`${flights.economyAvailable} - ${seatCount}` })\n            .where(\n              and(\n                eq(flights.id, input.flightId),\n                gte(flights.economyAvailable, seatCount)\n              )\n            )\n        : await tx\n            .update(flights)\n            .set({ businessAvailable: sql`${flights.businessAvailable} - ${seatCount}` })\n            .where(\n              and(\n                eq(flights.id, input.flightId),\n                gte(flights.businessAvailable, seatCount)\n              )\n            );\n\n    if (getAffectedRows(seatUpdate) !== 1) {\n      throw new TRPCError({\n        code: "BAD_REQUEST",\n        message: "Not enough seats available",\n      });\n    }\n\n    const bookingResult = await tx.insert(bookings).values({\n      userId: 0,\n      flightId: input.flightId,\n      bookingReference,\n      pnr,\n      status: "pending",\n      totalAmount,\n      cabinClass: input.cabinClass,\n      numberOfPassengers: seatCount,\n    });\n    const bookingId =\n      (bookingResult as unknown as { insertId?: number }).insertId ??\n      Number((bookingResult as unknown as Array<{ insertId?: number }>)[0]?.insertId);\n\n    if (!bookingId) {\n      throw new Error("Failed to create agent booking");\n    }\n\n    await tx.insert(agentBookings).values({\n      agentId,\n      bookingId,\n      commissionRate: String(commissionRate),\n      commissionAmount,\n      bookingAmount: totalAmount,\n      externalReference: input.externalReference,\n    });\n\n    await tx\n      .update(travelAgents)\n      .set({\n        totalBookings: sql`${travelAgents.totalBookings} + 1`,\n        totalRevenue: sql`${travelAgents.totalRevenue} + ${totalAmount}`,\n        totalCommission: sql`${travelAgents.totalCommission} + ${commissionAmount}`,\n      })\n      .where(eq(travelAgents.id, agentId));\n\n    log.info(\n      { agentId, bookingId, commission: commissionAmount },\n      "Agent booking created"\n    );\n\n    return { bookingId, bookingReference, commission: commissionAmount };\n  });\n}\n\n'''
          s=s[:start]+prefix+tail+s[end:]
          p.write_text(s)
          Path('server/services/travel-agent.inventory-atomicity.test.ts').write_text('''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\n\ndescribe("travel agent inventory atomicity", () => {\n  const source = readFileSync(new URL("./travel-agent.service.ts", import.meta.url), "utf8");\n  it("reserves inventory inside the booking transaction", () => {\n    expect(source).toContain("return db.transaction(async tx =>");\n    expect(source).toContain("gte(flights.economyAvailable, seatCount)");\n    expect(source).toContain("gte(flights.businessAvailable, seatCount)");\n    expect(source).toContain("getAffectedRows(seatUpdate) !== 1");\n    expect(source).toContain("await tx.insert(bookings)");\n    expect(source).toContain("await tx.insert(agentBookings)");\n  });\n});\n''')
          PY
      - name: Verify
        run: |
          pnpm exec prettier --write server/services/travel-agent.service.ts server/services/travel-agent.inventory-atomicity.test.ts
          pnpm exec prettier --check server/services/travel-agent.service.ts server/services/travel-agent.inventory-atomicity.test.ts
          pnpm check
          pnpm exec vitest run server/services/travel-agent.inventory-atomicity.test.ts
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/services/travel-agent.service.ts server/services/travel-agent.inventory-atomicity.test.ts
          git commit -m "fix(inventory): make agent booking creation atomic"
          git push origin HEAD:fix/travel-agent-inventory-atomicity-20260908
