name: AIS Railway staging connection preflight

# Staging only. No deployments, database calls, migrations or config mutations.
on:
  pull_request:
    paths:
      - ".github/workflows/railway-staging-connection-preflight.yml"
      - "scripts/ci/railway_staging_connection_preflight.py"
      - "scripts/ci/test_railway_staging_connection_preflight.py"
      - "docs/runbooks/RAILWAY_GITHUB_ACTIONS_CONNECTION.md"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact reviewed 40-character main SHA for read-only staging connectivity"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parser-contract:
    name: Read-only staging parser and receipt contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prove fail-closed staging scope and secret-free receipts
        run: python3 -m unittest discover -s scripts/ci -p 'test_railway_staging_connection_preflight.py' -v

  staging-connection:
    name: Staging project-token status read (never deploy)
    needs: parser-contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: "true"
      RAILWAY_NO_AUTO_UPDATE: "1"
      AIS_RAILWAY_PROJECT_ID: "d0425f39-b1dc-4cf3-b7d9-0aab68d6ae9b"
      AIS_RAILWAY_STAGING_ENVIRONMENT_ID: "6067b737-ceb8-465c-a798-5ecc8061ccef"
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Refuse non-main source and SHA drift
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Only refs/heads/main is eligible for staging connection proof"
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Expected SHA differs from checked-out main commit"
            exit 1
          fi
          echo "source_sha=$GITHUB_SHA scope=read-only-staging"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"
      - name: Install pinned Railway CLI before exposing project token
        run: |
          npm install --global @railway/cli@5.63.1
          test "$(railway --version)" = "railway 5.63.1"
      - name: Read Railway staging context (raw output never printed)
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.AIS_RAILWAY_STAGING_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "::error::Missing AIS_RAILWAY_STAGING_PROJECT_TOKEN secret"
            exit 1
          fi
          if [[ -n "${RAILWAY_API_TOKEN:-}" ]]; then
            echo "::error::Account-wide Railway token is forbidden"
            exit 1
          fi
          status_file="$RUNNER_TEMP/railway-staging-status.json"
          error_file="$RUNNER_TEMP/railway-staging-stderr.txt"
          if ! timeout 90s railway status --json \
              --project "$AIS_RAILWAY_PROJECT_ID" \
              --environment "$AIS_RAILWAY_STAGING_ENVIRONMENT_ID" \
              >"$status_file" 2>"$error_file"; then
            echo "::error::Railway status read failed; check token, scope or platform incident. Raw response withheld"
            exit 1
          fi
      - name: Verify exact IDs and produce redacted evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/railway_staging_connection_preflight.py \
            --status-json "$RUNNER_TEMP/railway-staging-status.json" \
            --source-sha "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/railway-staging-connection-evidence.json"
      - name: Store sanitized read-only receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ais-railway-staging-connection-${{ github.sha }}
          path: ${{ runner.temp }}/railway-staging-connection-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove raw status and stderr
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/railway-staging-status.json" "$RUNNER_TEMP/railway-staging-stderr.txt"
