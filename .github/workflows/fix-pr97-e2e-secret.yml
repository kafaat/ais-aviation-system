name: Repair PR97 E2E JWT Fixture
on:
  push:
    branches: [fix/auth-service-jwt-secret-boundary-20260907]
    paths: [.github/workflows/fix-pr97-e2e-secret.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-service-jwt-secret-boundary-20260907
      - name: Make the E2E signing secret ephemeral
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci-cd.yml')
          text = path.read_text()
          legacy = '          JWT_SECRET: test-secret-key-for-ci\n'
          count = text.count(legacy)
          if count != 3:
              raise SystemExit(f'expected exactly 3 legacy E2E JWT fixtures, found {count}')
          text = text.replace(legacy, '')
          marker = '      - name: Start auth service\n'
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one Start auth service step')
          generator = (
              '      - name: Generate ephemeral E2E JWT signing secret\n'
              '        shell: bash\n'
              '        run: |\n'
              '          set -euo pipefail\n'
              '          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"\n\n'
          )
          text = text.replace(marker, generator + marker)
          path.write_text(text)
          PY
          git diff --check
          grep -F 'Generate ephemeral E2E JWT signing secret' .github/workflows/ci-cd.yml
          if grep -Fq 'JWT_SECRET: test-secret-key-for-ci' .github/workflows/ci-cd.yml; then
            echo 'legacy JWT fixture remains' >&2
            exit 1
          fi
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci-cd.yml
          git commit -m 'ci: generate ephemeral JWT secret for E2E auth service'
          git push origin HEAD:fix/auth-service-jwt-secret-boundary-20260907
