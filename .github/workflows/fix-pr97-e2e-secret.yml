name: Repair PR97 E2E JWT Fixture
on:
  push:
    branches: [fix/auth-service-jwt-secret-boundary-20260907]
    paths: [.github/workflows/fix-pr97-e2e-secret.yml]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-service-jwt-secret-boundary-20260907
          persist-credentials: false
      - name: Make CI signing secrets ephemeral
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci-cd.yml')
          text = path.read_text()
          legacy = '          JWT_SECRET: test-secret-key-for-ci\n'
          count = text.count(legacy)
          if count != 4:
              raise SystemExit(f'expected exactly 4 legacy CI JWT fixtures, found {count}')
          text = text.replace(legacy, '')

          test_marker = '      - name: Run tests with coverage\n'
          e2e_marker = '      - name: Start auth service\n'
          if text.count(test_marker) != 1 or text.count(e2e_marker) != 1:
              raise SystemExit('expected one test marker and one auth-service marker')

          generator = (
              '      - name: Generate ephemeral JWT signing secret\n'
              '        shell: bash\n'
              '        run: |\n'
              '          set -euo pipefail\n'
              '          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"\n\n'
          )
          text = text.replace(test_marker, generator + test_marker)
          text = text.replace(e2e_marker, generator + e2e_marker)
          path.write_text(text)
          PY
          git diff --check
          test "$(grep -Fc 'Generate ephemeral JWT signing secret' .github/workflows/ci-cd.yml)" = 2
          if grep -Fq 'JWT_SECRET: test-secret-key-for-ci' .github/workflows/ci-cd.yml; then
            echo 'legacy JWT fixture remains' >&2
            exit 1
          fi
      - name: Export repaired workflow
        uses: actions/upload-artifact@v4
        with:
          name: pr97-repaired-ci-workflow
          path: .github/workflows/ci-cd.yml
          retention-days: 2
          if-no-files-found: error
