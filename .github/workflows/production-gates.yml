name: Production Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migration-replay:
    name: Migration Replay
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: ais_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Replay committed migrations on an empty database
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_migration_test
        run: pnpm run db:migrate
      - name: Verify migration result matches the declared schema
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_migration_test
        run: |
          pnpm exec drizzle-kit check

  previous-release-upgrade:
    name: Previous Release Upgrade Replay
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: ais_upgrade_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Resolve previous release
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(git tag --merged HEAD --sort=-version:refname | head -n 1)"
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous release tag is reachable from this candidate" >&2
            exit 1
          fi
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "Testing upgrade from $PREVIOUS_TAG to $GITHUB_SHA"
      - name: Materialize previous release
        run: git worktree add --detach /tmp/ais-previous-release "${{ steps.previous.outputs.tag }}"
      - name: Install previous-release dependencies
        working-directory: /tmp/ais-previous-release
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build database at previous release
        working-directory: /tmp/ais-previous-release
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_upgrade_test
        run: pnpm run db:migrate
      - name: Install current dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Upgrade previous-release database with current migrations
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_upgrade_test
        run: pnpm run db:migrate
      - name: Verify upgraded database matches current schema
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_upgrade_test
        run: pnpm exec drizzle-kit check

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reject high or critical dependency vulnerabilities
        run: pnpm audit --audit-level=high

  docker-contract:
    name: Docker Production Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
      - name: Build production and migrator images
        run: |
          docker build -f Dockerfile.prod --target runner -t ais-production-gate:runner .
          docker build -f Dockerfile.prod --target migrator -t ais-production-gate:migrator .
      - name: Verify migrator is self-contained
        run: |
          docker run --rm --network none --entrypoint sh ais-production-gate:migrator -ec \
            'test -x ./node_modules/.bin/drizzle-kit && ./node_modules/.bin/drizzle-kit --version >/dev/null'
      - name: Verify production probe topology
        run: |
          set -euo pipefail

          healthcheck="$(docker inspect --format '{{json .Config.Healthcheck.Test}}' ais-production-gate:runner)"
          echo "$healthcheck"
          grep -q '/api/trpc/health.live' <<<"$healthcheck"

          probe_files=(
            Dockerfile.prod
            docker-compose.prod.yml
            docker-compose.production.yml
            k8s/base/deployment.yaml
            scripts/smoke-tests.sh
            scripts/e2e-critical.sh
            .github/workflows/ci-cd.yml
          )
          for file in "${probe_files[@]}"; do
            if grep -q '/api/trpc/health.check' "$file"; then
              echo "admin-only health.check must not be used by production probes: $file" >&2
              exit 1
            fi
          done

          grep -q '/api/trpc/health.live' docker-compose.prod.yml
          test "$(grep -c '/api/trpc/health.live' docker-compose.production.yml)" -eq 3

          test "$(grep -c 'path: /api/trpc/health.live' k8s/base/deployment.yaml)" -eq 2
          test "$(grep -c 'path: /api/trpc/health.ready' k8s/base/deployment.yaml)" -eq 1
          grep -q 'prometheus.io/path: "/api/metrics"' k8s/base/deployment.yaml

          grep -q '/api/trpc/health.live' scripts/smoke-tests.sh
          grep -q '/api/trpc/health.ready' scripts/smoke-tests.sh
          grep -q '/api/trpc/health.live' scripts/e2e-critical.sh
          grep -q '/api/trpc/health.ready' scripts/e2e-critical.sh

          test "$(grep -c '/api/trpc/health.ready' .github/workflows/ci-cd.yml)" -ge 2
          grep -q '/api/trpc/health.live' .github/workflows/ci-cd.yml

          bash -n scripts/smoke-tests.sh scripts/e2e-critical.sh
