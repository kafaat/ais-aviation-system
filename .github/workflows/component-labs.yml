name: Aviation Component Labs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Started by Release Automation on a token-pushed release branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-labs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: REST State Machine and Microcks Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: ais_contract_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      NODE_ENV: test
      AIS_DISPOSABLE_DATABASE: "true"
      DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_contract_test
      REDIS_URL: redis://127.0.0.1:6379/1
      JWT_SECRET: acceptance-only-signing-key-not-for-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.x"
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r scripts/contracts/requirements.txt
      - run: pnpm db:migrate
      - name: Exercise real REST state and isolated provider wire contracts
        run: python scripts/contracts/run.py all --report "$RUNNER_TEMP/contract-lab"
      - name: Preserve laboratory evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aviation-contract-lab
          path: ${{ runner.temp }}/contract-lab
          if-no-files-found: error

  transport-faults:
    name: TCP Faults and Worker Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: ais_fault_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      NODE_ENV: test
      AIS_DISPOSABLE_DATABASE: "true"
      DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_fault_test
      REDIS_URL: redis://127.0.0.1:6379/1
      JWT_SECRET: acceptance-only-signing-key-not-for-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.x"
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r scripts/contracts/requirements.txt
      - run: pnpm db:migrate
      - name: Prove real transaction boundaries before injecting transport faults
        run: pnpm test:acceptance "$RUNNER_TEMP/fault-baseline.json"
      - name: Inject TCP outage, delayed acknowledgement and worker death
        run: python scripts/contracts/run_faults.py --report "$RUNNER_TEMP/transport-faults.json"
      - name: Preserve fault evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aviation-transport-faults
          path: |
            ${{ runner.temp }}/fault-baseline.json
            ${{ runner.temp }}/transport-faults.json
          if-no-files-found: error
