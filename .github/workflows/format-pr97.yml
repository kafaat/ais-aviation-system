name: Format PR97 Contract Test
on:
  push:
    branches: [fix/auth-service-jwt-secret-boundary-20260907]
    paths: [.github/workflows/format-pr97.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-service-jwt-secret-boundary-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format exact contract test and commit only if changed
        run: |
          pnpm exec prettier --write server/__tests__/auth-service-jwt-secret-contract.test.ts
          if git diff --quiet -- server/__tests__/auth-service-jwt-secret-contract.test.ts; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/__tests__/auth-service-jwt-secret-contract.test.ts
          git commit -m 'style: apply pinned prettier to auth contract test'
          git push origin HEAD:fix/auth-service-jwt-secret-boundary-20260907
