name: Apply tenant not-null boundary

on:
  workflow_dispatch:
  push:
    branches:
      - fix/tenant-operational-not-null-20260909

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'chore(ci):') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
        with:
          ref: fix/tenant-operational-not-null-20260909
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Enforce tenant-bound operational writers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old[:80]!r}')
              p.write_text(s.replace(old, new))

          # Schema: operational booking/passenger rows may never be tenantless.
          replace_exact(
              'drizzle/schema.ts',
              '    // Tenant (airline) this booking belongs to. Nullable during migration.\n    tenantId: int("tenantId"),',
              '    // Tenant (airline) this booking belongs to. Operational rows are always tenant-bound.\n    tenantId: int("tenantId").notNull(),'
          )
          replace_exact(
              'drizzle/schema.ts',
              '    // Tenant (airline) this passenger belongs to. Nullable during migration.\n    tenantId: int("tenantId"),',
              '    // Tenant (airline) this passenger belongs to. Operational rows are always tenant-bound.\n    tenantId: int("tenantId").notNull(),'
          )

          # Canonical booking: always derive the authoritative tenant from the flight.
          replace_exact(
              'server/services/bookings.service.ts',
              '''    if (input.tenantId != null) {\n      const database = await getDb();\n      if (!database) throw new Error("Database not available");\n      const [flightTenant] = await database\n        .select({ tenantId: flights.tenantId })\n        .from(flights)\n        .where(eq(flights.id, input.flightId))\n        .limit(1);\n\n      if (!flightTenant || flightTenant.tenantId !== input.tenantId) {\n        throw new TRPCError({ code: "NOT_FOUND", message: "Flight not found" });\n      }\n    }''',
              '''    const database = await getDb();\n    if (!database) throw new Error("Database not available");\n    const [flightTenant] = await database\n      .select({ tenantId: flights.tenantId })\n      .from(flights)\n      .where(eq(flights.id, input.flightId))\n      .limit(1);\n\n    if (!flightTenant || flightTenant.tenantId == null) {\n      throw new TRPCError({ code: "NOT_FOUND", message: "Flight not found" });\n    }\n    if (input.tenantId != null && flightTenant.tenantId !== input.tenantId) {\n      throw new TRPCError({ code: "NOT_FOUND", message: "Flight not found" });\n    }\n    const effectiveTenantId = flightTenant.tenantId;'''
          )
          replace_exact(
              'server/services/bookings.service.ts',
              '      ...(input.tenantId == null ? {} : { tenantId: input.tenantId }),',
              '      tenantId: effectiveTenantId,',
              count=2
          )

          # Multi-city: every segment must resolve to one non-null tenant.
          replace_exact('server/services/multi-city.service.ts', 'import { eq } from "drizzle-orm";', 'import { eq, inArray } from "drizzle-orm";')
          replace_exact(
              'server/services/multi-city.service.ts',
              '''  try {\n    // Validate and calculate pricing (before transaction to avoid holding locks)''',
              '''  try {\n    const segmentFlightIds = [...new Set(input.segments.map(segment => segment.flightId))];\n    const tenantRows = await database\n      .select({ id: flights.id, tenantId: flights.tenantId })\n      .from(flights)\n      .where(inArray(flights.id, segmentFlightIds));\n    const tenantIds = new Set(tenantRows.map(row => row.tenantId));\n    if (\n      tenantRows.length !== segmentFlightIds.length ||\n      tenantIds.size !== 1 ||\n      tenantRows[0]?.tenantId == null\n    ) {\n      throw new TRPCError({\n        code: "BAD_REQUEST",\n        message: "All itinerary segments must belong to the same tenant",\n      });\n    }\n    const tenantId = tenantRows[0].tenantId;\n\n    // Validate and calculate pricing (before transaction to avoid holding locks)'''
          )
          replace_exact('server/services/multi-city.service.ts', '        userId: input.userId,\n        flightId: input.segments[0].flightId,', '        tenantId,\n        userId: input.userId,\n        flightId: input.segments[0].flightId,')
          replace_exact('server/services/multi-city.service.ts', '      const passengersData = input.passengers.map(p => ({\n        bookingId,', '      const passengersData = input.passengers.map(p => ({\n        tenantId,\n        bookingId,')

          # NDC: bind the internal order to the tenant of every offered flight segment.
          replace_exact('server/services/ndc.service.ts', 'import { eq, and, gte, lte, desc, asc, lt, sql } from "drizzle-orm";', 'import { eq, and, gte, lte, desc, asc, lt, sql, inArray } from "drizzle-orm";')
          replace_exact(
              'server/services/ndc.service.ts',
              '''  // Determine userId (from params or default to system user 0)\n  const userId = params.userId ?? 0;\n\n  const [bookingResult] = await db.insert(bookings).values({\n    userId,\n    flightId: safeParseJson<NdcSegment[]>(offer.segments, [])[0]?.flightId ?? 0,''',
              '''  // Determine userId (from params or default to system user 0)\n  const userId = params.userId ?? 0;\n  const offerSegments = safeParseJson<NdcSegment[]>(offer.segments, []);\n  const offerFlightIds = [...new Set(offerSegments.map(segment => segment.flightId))];\n  if (offerFlightIds.length === 0) {\n    throw new TRPCError({ code: "BAD_REQUEST", message: "NDC offer has no flights" });\n  }\n  const tenantRows = await db\n    .select({ id: flights.id, tenantId: flights.tenantId })\n    .from(flights)\n    .where(inArray(flights.id, offerFlightIds));\n  const tenantIds = new Set(tenantRows.map(row => row.tenantId));\n  if (\n    tenantRows.length !== offerFlightIds.length ||\n    tenantIds.size !== 1 ||\n    tenantRows[0]?.tenantId == null\n  ) {\n    throw new TRPCError({\n      code: "BAD_REQUEST",\n      message: "NDC offer flights must belong to one tenant",\n    });\n  }\n  const tenantId = tenantRows[0].tenantId;\n\n  const [bookingResult] = await db.insert(bookings).values({\n    tenantId,\n    userId,\n    flightId: offerFlightIds[0],'''
          )
          replace_exact('server/services/ndc.service.ts', '  const passengerRecords = params.passengers.map(p => ({\n    bookingId,', '  const passengerRecords = params.passengers.map(p => ({\n    tenantId,\n    bookingId,')

          # Rebooking: retain the original booking tenant and forbid cross-tenant flight moves.
          replace_exact('server/services/rebooking.service.ts', 'export interface RebookData {\n  originalBookingId: number;', 'export interface RebookData {\n  tenantId: number;\n  originalBookingId: number;')
          replace_exact('server/services/rebooking.service.ts', '      id: bookings.id,\n      bookingReference: bookings.bookingReference,', '      id: bookings.id,\n      tenantId: bookings.tenantId,\n      bookingReference: bookings.bookingReference,')
          replace_exact('server/services/rebooking.service.ts', '  return {\n    originalBookingId: booking.id,', '  if (booking.tenantId == null) {\n    throw new TRPCError({ code: "NOT_FOUND", message: "Booking not found" });\n  }\n\n  return {\n    tenantId: booking.tenantId,\n    originalBookingId: booking.id,')
          replace_exact('server/services/rebooking.service.ts', '''  if (!newFlight) {\n    throw new TRPCError({\n      code: "NOT_FOUND",\n      message: "Selected flight not found or not available",\n    });\n  }''', '''  if (!newFlight || newFlight.tenantId !== rebookData.tenantId) {\n    throw new TRPCError({\n      code: "NOT_FOUND",\n      message: "Selected flight not found or not available",\n    });\n  }''')
          replace_exact('server/services/rebooking.service.ts', '    const bookingResult = await tx.insert(bookings).values({\n      userId,', '    const bookingResult = await tx.insert(bookings).values({\n      tenantId: rebookData.tenantId,\n      userId,')
          replace_exact('server/services/rebooking.service.ts', '      await tx.insert(passengers).values({\n        bookingId: insertedBookingId,', '      await tx.insert(passengers).values({\n        tenantId: rebookData.tenantId,\n        bookingId: insertedBookingId,')

          # Travel agent: flight ownership is the tenant authority.
          replace_exact('server/services/travel-agent.service.ts', '''    if (!flight) {\n      throw new TRPCError({ code: "NOT_FOUND", message: "Flight not found" });\n    }''', '''    if (!flight || flight.tenantId == null) {\n      throw new TRPCError({ code: "NOT_FOUND", message: "Flight not found" });\n    }''')
          replace_exact('server/services/travel-agent.service.ts', '    const bookingResult = await tx.insert(bookings).values({\n      userId: 0,', '    const bookingResult = await tx.insert(bookings).values({\n      tenantId: flight.tenantId,\n      userId: 0,')

          test = Path('server/__tests__/tenant-operational-not-null-contract.test.ts')
          test.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst schema = readFileSync("drizzle/schema.ts", "utf8");\n\ndescribe("operational tenant nullability contract", () => {\n  it("requires bookings and passengers to carry a tenant id", () => {\n    const bookingBlock = schema.slice(schema.indexOf('export const bookings = mysqlTable('), schema.indexOf('export type Booking ='));\n    const passengerBlock = schema.slice(schema.indexOf('export const passengers = mysqlTable('), schema.indexOf('export type Passenger ='));\n    expect(bookingBlock).toContain('tenantId: int("tenantId").notNull()');\n    expect(passengerBlock).toContain('tenantId: int("tenantId").notNull()');\n  });\n\n  it("binds every active booking writer to a trusted tenant source", () => {\n    const canonical = readFileSync("server/services/bookings.service.ts", "utf8");\n    const multiCity = readFileSync("server/services/multi-city.service.ts", "utf8");\n    const ndc = readFileSync("server/services/ndc.service.ts", "utf8");\n    const rebooking = readFileSync("server/services/rebooking.service.ts", "utf8");\n    const agent = readFileSync("server/services/travel-agent.service.ts", "utf8");\n    expect(canonical).toContain("tenantId: effectiveTenantId");\n    expect(multiCity).toContain("const tenantIds = new Set");\n    expect(multiCity).toContain("tenantId,\\n        userId: input.userId");\n    expect(ndc).toContain("NDC offer flights must belong to one tenant");\n    expect(rebooking).toContain("newFlight.tenantId !== rebookData.tenantId");\n    expect(agent).toContain("tenantId: flight.tenantId");\n  });\n});\n''')
          PY
      - name: Generate Drizzle migration metadata
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/ais_generate_only
        run: pnpm run db:generate
      - name: Format and verify
        run: |
          pnpm exec prettier --write drizzle/schema.ts server/services/bookings.service.ts server/services/multi-city.service.ts server/services/ndc.service.ts server/services/rebooking.service.ts server/services/travel-agent.service.ts server/__tests__/tenant-operational-not-null-contract.test.ts drizzle/meta/_journal.json
          pnpm exec prettier --check drizzle/schema.ts server/services/bookings.service.ts server/services/multi-city.service.ts server/services/ndc.service.ts server/services/rebooking.service.ts server/services/travel-agent.service.ts server/__tests__/tenant-operational-not-null-contract.test.ts
          pnpm check
          pnpm exec vitest run server/__tests__/tenant-operational-not-null-contract.test.ts server/__tests__/migration-journal-parity.test.ts
          git diff --check
      - name: Commit generated slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/schema.ts drizzle/*.sql drizzle/meta server/services/bookings.service.ts server/services/multi-city.service.ts server/services/ndc.service.ts server/services/rebooking.service.ts server/services/travel-agent.service.ts server/__tests__/tenant-operational-not-null-contract.test.ts
          git commit -m "fix(tenancy): require operational tenant ids"
          git push origin HEAD:fix/tenant-operational-not-null-20260909
