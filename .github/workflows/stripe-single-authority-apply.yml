name: Apply Stripe single-authority consolidation

on:
  push:
    branches: [fix/stripe-webhook-single-authority-20260907]
    paths: [.github/workflows/stripe-single-authority-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stripe-webhook-single-authority-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Consolidate all runtime Stripe processing on canonical handler
        run: |
          python3 - <<'PY'
          from pathlib import Path

          canonical = Path('server/webhooks/stripe.ts')
          text = canonical.read_text()
          text = text.replace('      await processEvent(tx, event);', '      await processStripeEvent(tx, event);', 1)
          old = '''async function processEvent(\n  tx: DatabaseTransaction,\n  event: Stripe.Event\n): Promise<void> {'''
          new = '''export async function processStripeEvent(\n  tx: DatabaseTransaction,\n  event: Stripe.Event\n): Promise<void> {'''
          assert text.count(old) == 1
          canonical.write_text(text.replace(old, new, 1))

          q = Path('server/services/queue.service.ts')
          text = q.read_text()
          old = '''      const { stripeWebhookServiceV2 } =\n        await import("./stripe-webhook-v2.service");\n\n      await db.transaction(async tx => {\n        await stripeWebhookServiceV2.processEvent(tx, stripeEvent as any);'''
          new = '''      const { processStripeEvent } = await import("../webhooks/stripe");\n\n      await db.transaction(async tx => {\n        await processStripeEvent(tx, stripeEvent);'''
          assert text.count(old) == 1
          q.write_text(text.replace(old, new, 1))

          q2 = Path('server/services/queue-v2.service.ts')
          text = q2.read_text()
          old = '''        const { stripeWebhookServiceV2 } =\n          await import("./stripe-webhook-v2.service");\n\n        let eventData: unknown;'''
          new = '''        const { processStripeEvent } = await import("../webhooks/stripe");\n\n        let eventData: unknown;'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''        await db.transaction(async tx => {\n          await stripeWebhookServiceV2.processEvent(tx, {\n            id: event.id,\n            type: event.type,\n            data: { object: eventData },\n          } as any);'''
          new = '''        await db.transaction(async tx => {\n          await processStripeEvent(\n            tx,\n            {\n              id: event.id,\n              type: event.type,\n              data: { object: eventData },\n            } as Parameters<typeof processStripeEvent>[1]\n          );'''
          assert text.count(old) == 1
          q2.write_text(text.replace(old, new, 1))

          route = Path('server/routes/webhooks.ts')
          route.write_text('''/**\n * Legacy /webhooks router kept as a thin compatibility wrapper.\n * All Stripe processing is delegated to the canonical handler used by\n * /api/stripe/webhook so there is only one financial state machine.\n */\n\nimport express, { Request, Response, Router } from "express";\nimport { handleStripeWebhook } from "../webhooks/stripe";\n\nconst router: Router = express.Router();\n\nrouter.post(\n  "/stripe",\n  express.raw({ type: "application/json" }),\n  handleStripeWebhook\n);\n\nrouter.get("/health", (_req: Request, res: Response) => {\n  res.status(200).json({\n    status: "ok",\n    service: "webhooks",\n    timestamp: new Date().toISOString(),\n  });\n});\n\nexport default router;\n''')

          legacy = Path('server/services/stripe-webhook-v2.service.ts')
          assert legacy.exists()
          legacy.unlink()

          test = Path('server/__tests__/webhooks/stripe-single-authority.test.ts')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''import { existsSync, readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst root = new URL("../../../", import.meta.url);\nconst read = (path: string) => readFileSync(new URL(path, root), "utf8");\n\ndescribe("Stripe webhook single-authority boundary", () => {\n  it("uses the canonical processor for both retry workers", () => {\n    for (const path of [\n      "server/services/queue.service.ts",\n      "server/services/queue-v2.service.ts",\n    ]) {\n      const source = read(path);\n      expect(source).toContain("processStripeEvent");\n      expect(source).not.toContain("stripeWebhookServiceV2");\n      expect(source).not.toContain("stripe-webhook-v2.service");\n    }\n  });\n\n  it("keeps the compatibility route on the canonical HTTP handler", () => {\n    const source = read("server/routes/webhooks.ts");\n    expect(source).toContain("handleStripeWebhook");\n    expect(source).not.toContain("stripeWebhookServiceV2");\n  });\n\n  it("exports one canonical transactional event processor", () => {\n    const source = read("server/webhooks/stripe.ts");\n    expect(source).toContain("export async function processStripeEvent");\n    expect(source).toContain("await processStripeEvent(tx, event)");\n  });\n\n  it("removes the divergent v2 financial state machine", () => {\n    expect(\n      existsSync(new URL("server/services/stripe-webhook-v2.service.ts", root))\n    ).toBe(false);\n  });\n});\n''')
          PY
      - name: Install locked dependencies and format
        run: |
          npm install --global pnpm@10.28.2
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec prettier --write server/webhooks/stripe.ts server/services/queue.service.ts server/services/queue-v2.service.ts server/routes/webhooks.ts server/__tests__/webhooks/stripe-single-authority.test.ts
          pnpm exec prettier --check server/webhooks/stripe.ts server/services/queue.service.ts server/services/queue-v2.service.ts server/routes/webhooks.ts server/__tests__/webhooks/stripe-single-authority.test.ts
      - name: Typecheck and focused regression
        run: |
          pnpm check
          pnpm exec vitest run server/__tests__/webhooks/stripe-single-authority.test.ts
      - name: Commit consolidation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/webhooks/stripe.ts server/services/queue.service.ts server/services/queue-v2.service.ts server/routes/webhooks.ts server/services/stripe-webhook-v2.service.ts server/__tests__/webhooks/stripe-single-authority.test.ts
          git commit -m 'fix(webhooks): consolidate Stripe processing on one authority'
          git push origin HEAD:fix/stripe-webhook-single-authority-20260907
