name: AIS Remediation Workspace
on:
  push:
    branches: [fix/ais-p0-remediation-20260906]
    paths: [.github/workflows/ais-remediation-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2b6d780e86a8dcb1962b51d3d72f27276fb4f84b
          persist-credentials: false
      - run: |
          mkdir -p /tmp/ais-main
          git archive --format=zip --output=/tmp/ais-main/source.zip HEAD
          git rev-parse HEAD > /tmp/ais-main/SOURCE_SHA.txt
          sha256sum /tmp/ais-main/source.zip > /tmp/ais-main/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ais-main-snapshot
          path: /tmp/ais-main/
          retention-days: 7
          if-no-files-found: error
