name: AIS Remediation Workspace

on:
  push:
    branches: [fix/ais-p0-remediation-20260906]
    paths: [.github/workflows/ais-remediation-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Export tracked source (no credentials or runtime secrets)
        run: |
          mkdir -p /tmp/ais-workspace
          git archive --format=zip --output=/tmp/ais-workspace/source.zip HEAD
          git rev-parse HEAD > /tmp/ais-workspace/SOURCE_SHA.txt
          sha256sum /tmp/ais-workspace/source.zip > /tmp/ais-workspace/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ais-remediation-source
          path: /tmp/ais-workspace/
          retention-days: 7
          if-no-files-found: error
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.2
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Export dependency workspace
        run: tar -czf /tmp/ais-node-modules.tgz node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ais-remediation-dependencies
          path: /tmp/ais-node-modules.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
