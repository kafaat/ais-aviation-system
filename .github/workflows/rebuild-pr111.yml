name: Rebuild PR111 migration

on:
  push:
    branches:
      - fix/operational-uniqueness-20260908

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply schema invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('drizzle/schema.ts')
          s = p.read_text()
          s = s.replace('ticketNumberIdx: index("passengers_ticket_number_idx").on(', 'ticketNumberIdx: uniqueIndex("passengers_ticket_number_uq").on(')
          s = s.replace('seatInvSeatNumberIdx: index("seat_inv_seat_number_idx").on(', 'seatInvSeatNumberIdx: uniqueIndex("seat_inv_flight_seat_uq").on(')
          p.write_text(s)
          PY
      - name: Generate authoritative migration
        env:
          DATABASE_URL: mysql://ais:ais@127.0.0.1:3306/ais
        run: pnpm db:generate -- --name operational_uniqueness
      - name: Add regression contract
        run: |
          cat > server/services/operational-uniqueness.test.ts <<'EOF'
          import { readFileSync, readdirSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          describe("operational uniqueness contract", () => {
            const schema = readFileSync("drizzle/schema.ts", "utf8");
            const migrations = readdirSync("drizzle")
              .filter(name => /^\d{4}_.*\.sql$/.test(name))
              .map(name => readFileSync(`drizzle/${name}`, "utf8"))
              .join("\n");

            it("makes passenger ticket numbers unique", () => {
              expect(schema).toContain('uniqueIndex("passengers_ticket_number_uq").on(');
              expect(migrations).toContain("passengers_ticket_number_uq");
            });

            it("makes seat numbers unique within a flight", () => {
              expect(schema).toContain('uniqueIndex("seat_inv_flight_seat_uq").on(');
              expect(migrations).toContain("seat_inv_flight_seat_uq");
            });
          });
          EOF
      - name: Verify generated history and types
        env:
          DATABASE_URL: mysql://ais:ais@127.0.0.1:3306/ais
        run: |
          pnpm exec prettier --write drizzle/schema.ts drizzle/meta server/services/operational-uniqueness.test.ts
          pnpm check
          pnpm exec vitest run server/services/operational-uniqueness.test.ts server/services/migration-journal-parity.test.ts
      - name: Commit generated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add drizzle server/services/operational-uniqueness.test.ts
          git commit -m "fix(data): enforce ticket and seat uniqueness [skip ci]"
          git push origin HEAD:fix/operational-uniqueness-20260908
