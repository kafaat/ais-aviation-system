name: Temporary format PR115

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/migration-journal-parity-20260908'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed source files
        run: pnpm exec prettier --write drizzle.config.ts server/__tests__/migration-journal-parity.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet -- drizzle.config.ts server/__tests__/migration-journal-parity.test.ts; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drizzle.config.ts server/__tests__/migration-journal-parity.test.ts
          git commit -m 'style(migrations): apply pinned Prettier output'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
