name: Apply refund local atomicity

on:
  push:
    branches: [fix/refund-local-atomicity-20260907]
    paths: [.github/workflows/refund-atomicity-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/refund-local-atomicity-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: pnpm/action-setup@v4
      - name: Make local refund reconciliation atomic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/services/refunds.service.ts')
          s = p.read_text()
          old = '''    await database
      .update(bookings)
      .set({
        paymentStatus: isFullRefund ? "refunded" : "paid",
        status: isFullRefund ? "cancelled" : booking.status,
      })
      .where(eq(bookings.id, input.bookingId));

    if (isFullRefund && booking.status === "confirmed") {
      if (booking.cabinClass === "business") {
        await database
          .update(flights)
          .set({
            businessAvailable: sql`${flights.businessAvailable} + ${booking.numberOfPassengers}`,
          })
          .where(eq(flights.id, booking.flightId));
      } else {
        await database
          .update(flights)
          .set({
            economyAvailable: sql`${flights.economyAvailable} + ${booking.numberOfPassengers}`,
          })
          .where(eq(flights.id, booking.flightId));
      }

      console.info(
        `[Refund] Restored ${booking.numberOfPassengers} ${booking.cabinClass} seat(s) to flight ${booking.flightId}`
      );
    }

    const paymentResult = await database
      .select()
      .from(payments)
      .where(eq(payments.bookingId, input.bookingId))
      .limit(1);

    if (paymentResult[0]) {
      await database
        .update(payments)
        .set({
          status: isFullRefund ? "refunded" : "completed",
        })
        .where(eq(payments.id, paymentResult[0].id));
    }
'''
          new = '''    const localReconciliation = await database.transaction(async tx => {
      // Serialize local reconciliation for this booking. Stripe idempotency protects
      // provider money movement; this lock protects the corresponding local state
      // transition and makes seat restoration exactly-once.
      const [lockedBooking] = await tx
        .select()
        .from(bookings)
        .where(eq(bookings.id, input.bookingId))
        .for("update")
        .limit(1);

      if (!lockedBooking) {
        throw new TRPCError({
          code: "NOT_FOUND",
          message: "Booking not found during refund reconciliation",
        });
      }

      const shouldRestoreSeats =
        isFullRefund &&
        lockedBooking.paymentStatus !== "refunded" &&
        lockedBooking.status === "confirmed";

      await tx
        .update(bookings)
        .set({
          paymentStatus: isFullRefund ? "refunded" : "paid",
          status: isFullRefund ? "cancelled" : lockedBooking.status,
        })
        .where(eq(bookings.id, input.bookingId));

      if (shouldRestoreSeats) {
        if (lockedBooking.cabinClass === "business") {
          await tx
            .update(flights)
            .set({
              businessAvailable: sql`${flights.businessAvailable} + ${lockedBooking.numberOfPassengers}`,
            })
            .where(eq(flights.id, lockedBooking.flightId));
        } else {
          await tx
            .update(flights)
            .set({
              economyAvailable: sql`${flights.economyAvailable} + ${lockedBooking.numberOfPassengers}`,
            })
            .where(eq(flights.id, lockedBooking.flightId));
        }
      }

      const [payment] = await tx
        .select()
        .from(payments)
        .where(eq(payments.bookingId, input.bookingId))
        .limit(1);

      if (payment) {
        await tx
          .update(payments)
          .set({
            status: isFullRefund ? "refunded" : "completed",
          })
          .where(eq(payments.id, payment.id));
      }

      return { shouldRestoreSeats, lockedBooking };
    });

    if (localReconciliation.shouldRestoreSeats) {
      console.info(
        `[Refund] Restored ${localReconciliation.lockedBooking.numberOfPassengers} ${localReconciliation.lockedBooking.cabinClass} seat(s) to flight ${localReconciliation.lockedBooking.flightId}`
      );
    }
'''
          assert s.count(old) == 1, 'refund local-write block changed unexpectedly'
          p.write_text(s.replace(old, new, 1))

          test = Path('server/services/refunds.atomicity.test.ts')
          test.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst source = readFileSync(new URL("./refunds.service.ts", import.meta.url), "utf8");\n\ndescribe("refund local reconciliation atomicity", () => {\n  it("serializes booking reconciliation and restores seats only on the first full-refund transition", () => {\n    expect(source).toContain("database.transaction(async tx =>");\n    expect(source).toContain('.for("update")');\n    expect(source).toContain('lockedBooking.paymentStatus !== "refunded"');\n    expect(source).toContain('lockedBooking.status === "confirmed"');\n\n    const transactionStart = source.indexOf("const localReconciliation = await database.transaction");\n    const transactionEnd = source.indexOf("if (localReconciliation.shouldRestoreSeats)");\n    const transactionBody = source.slice(transactionStart, transactionEnd);\n\n    expect(transactionBody).toContain("await tx\\n            .update(flights)");\n    expect(transactionBody).toContain("await tx\\n        .update(bookings)");\n    expect(transactionBody).toContain("await tx\\n          .update(payments)");\n    expect(transactionBody).not.toContain("await database\\n          .update(flights)");\n  });\n});\n''')
          PY
      - name: Install, format and verify
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write server/services/refunds.service.ts server/services/refunds.atomicity.test.ts
          pnpm exec prettier --check server/services/refunds.service.ts server/services/refunds.atomicity.test.ts
          pnpm check
          pnpm exec vitest run server/services/refunds.atomicity.test.ts server/services/refunds.security.test.ts
      - name: Commit verified correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/services/refunds.service.ts server/services/refunds.atomicity.test.ts
          git commit -m 'fix(refunds): make local reconciliation atomic'
          git push origin HEAD:fix/refund-local-atomicity-20260907
