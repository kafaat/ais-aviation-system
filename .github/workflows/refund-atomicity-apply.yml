name: Apply refund local atomicity

on:
  push:
    branches:
      - fix/refund-local-atomicity-20260907
    paths:
      - .github/workflows/refund-atomicity-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/refund-local-atomicity-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: pnpm/action-setup@v4
      - name: Apply correction
        run: python3 scripts/ci/apply_refund_atomicity.py
      - name: Install and verify
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write server/services/refunds.service.ts server/services/refunds.atomicity.test.ts server/services/refunds.security.test.ts
          pnpm exec prettier --check server/services/refunds.service.ts server/services/refunds.atomicity.test.ts server/services/refunds.security.test.ts
          pnpm check
          pnpm exec vitest run server/services/refunds.atomicity.test.ts server/services/refunds.security.test.ts
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/services/refunds.service.ts server/services/refunds.atomicity.test.ts server/services/refunds.security.test.ts
          git commit -m "fix(refunds): make local reconciliation atomic"
          git push origin HEAD:fix/refund-local-atomicity-20260907
