name: Probe authoritative schema reconciliation

on:
  push:
    branches:
      - fix/migration-snapshot-baseline-20260909

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - name: Generate authoritative-to-schema delta
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/probe_only
        run: pnpm exec drizzle-kit generate --name=reconcile_probe
      - name: Report generated delta
        run: |
          set -euo pipefail
          file="$(ls drizzle/0013_*.sql)"
          echo "generated=$file"
          echo "create_tables=$(grep -c '^CREATE TABLE' "$file" || true)"
          echo "alter_tables=$(grep -c '^ALTER TABLE' "$file" || true)"
          echo "create_indexes=$(grep -Ec '^CREATE (UNIQUE )?INDEX' "$file" || true)"
          echo "drop_statements=$(grep -Ec '^DROP (TABLE|INDEX)| DROP ' "$file" || true)"
          echo '=== ALTER statements ==='
          grep '^ALTER TABLE' "$file" || true
          echo '=== CREATE table names ==='
          grep '^CREATE TABLE' "$file" | sed -E 's/^CREATE TABLE `([^`]+)`.*/\1/' || true
          wc -l -c "$file"
