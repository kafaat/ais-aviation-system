name: Apply Protected Routes

on:
  push:
    branches: [fix/protected-user-routes-20260909]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/protected-user-routes-20260909
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - name: Apply route wrappers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('client/src/App.tsx')
          text = path.read_text()
          import_line = 'import { ProtectedRoute } from "./components/ProtectedRoute";\n'
          anchor = 'import { AdminRoute } from "./components/AdminRoute";\n'
          if import_line not in text:
              text = text.replace(anchor, anchor + import_line)

          paths = [
              '/my-bookings', '/profile', '/favorites', '/price-alerts',
              '/saved-passengers', '/notifications', '/my-waitlist',
              '/rebook/:bookingId', '/payment-history', '/corporate',
              '/corporate/bookings',
          ]

          for route_path in paths:
              pattern = rf'(<Route path="{re.escape(route_path)}">\n)([\s\S]*?)(\n          </Route>)'
              matches = list(re.finditer(pattern, text))
              if len(matches) != 1:
                  raise SystemExit(f'expected one route for {route_path}, found {len(matches)}')
              body = matches[0].group(2)
              if '<ProtectedRoute>' in body:
                  continue
              indented = '\n'.join('  ' + line for line in body.splitlines())
              replacement = matches[0].group(1) + '            <ProtectedRoute>\n' + indented + '\n            </ProtectedRoute>' + matches[0].group(3)
              text = text[:matches[0].start()] + replacement + text[matches[0].end():]

          path.write_text(text)
          PY
          pnpm exec prettier --write client/src/App.tsx client/src/components/ProtectedRoute.tsx server/protected-routes-contract.test.ts
      - name: Verify
        run: |
          pnpm run check
          pnpm exec vitest run server/protected-routes-contract.test.ts
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add client/src/App.tsx client/src/components/ProtectedRoute.tsx server/protected-routes-contract.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(auth): protect account-scoped client routes"
          git push origin HEAD:fix/protected-user-routes-20260909
