name: Self-service format once

on:
  push:
    branches: [fix/self-service-capability-boundary-20260907]
    paths:
      - server/routers/bag-drop.ts
      - .github/workflows/self-service-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/self-service-capability-boundary-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter
        run: pnpm exec prettier --write server/routers/bag-drop.ts
      - name: Commit only formatter output
        run: |
          if git diff --quiet -- server/routers/bag-drop.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routers/bag-drop.ts
          git commit -m "style: apply repository formatter to bag-drop boundary"
          git push origin HEAD:fix/self-service-capability-boundary-20260907
