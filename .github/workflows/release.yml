name: Release Automation

# Two phases, both driven from main.
#
# 1. Propose: when main carries releasable commits (or on a manual dispatch),
#    the version bump and changelog are committed to a `release/vX.Y.Z` branch
#    and opened as a pull request. Nothing is pushed to main. The pull
#    request is created with GITHUB_TOKEN; once the repository allows Actions
#    to create pull requests, that creation raises pull_request events and the
#    required checks start on their own. The branch push alone starts nothing,
#    so when no pull_request run appears the checks are started explicitly
#    with workflow_dispatch, which that token may raise. The pull request then
#    needs the same review and checks as any other change.
#
# 2. Publish: when the tip of main is a merged release commit (only
#    package.json and CHANGELOG.md changed, version bumped, tag absent), the
#    tag and the GitHub release are created from that exact commit.
#
# This is what lets the main ruleset be enforced: no commit reaches main
# without a pull request, including the release bot's.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (patch, minor, major)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Create as prerelease"
        required: false
        default: false
        type: boolean
      custom_version:
        description: "Custom version (leave empty to auto-increment)"
        required: false
        type: string
      resume_tag:
        description: "Publish an existing tag without another version bump (optional)"
        required: false
        type: string
      resume_commit:
        description: "Exact 40-character commit for resume_tag"
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  NODE_VERSION: "22.x"

jobs:
  # =============================================================================
  # Decide: publish a merged release commit, propose a new one, or nothing
  # =============================================================================
  check-release:
    name: Check Release Conditions
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      release_type: ${{ steps.check.outputs.release_type }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      source_sha: ${{ steps.check.outputs.source_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Classify the trigger
        id: check
        env:
          RESUME_TAG: ${{ inputs.resume_tag }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          emit release_type none; emit tag ""; emit version ""; emit source_sha ""

          if [ -n "$RESUME_TAG" ]; then
            emit mode none
            exit 0
          fi

          # A merged release commit at the tip of main: publish it. The commit
          # is recognised by its content, never by its message, and the
          # publisher re-verifies the same facts before tagging.
          if [ "$EVENT_NAME" = "push" ]; then
            parent="$(git rev-parse HEAD^)"
            changed="$(git diff --name-only "$parent" HEAD)"
            unexpected="$(printf '%s\n' "$changed" | grep -vxE 'CHANGELOG\.md|package\.json' || true)"
            before="$(git show "$parent:package.json" | jq -r '.version')"
            after="$(jq -r '.version' package.json)"
            if [ -z "$unexpected" ] && printf '%s\n' "$changed" | grep -qx 'package.json' && [ "$before" != "$after" ]; then
              tag="v$after"
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                echo "::notice::$tag already exists; nothing to publish."
                emit mode none
                exit 0
              fi
              emit mode publish
              emit tag "$tag"
              emit version "$after"
              emit source_sha "$parent"
              exit 0
            fi
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            emit mode propose
            emit release_type "$INPUT_RELEASE_TYPE"
            exit 0
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline)
          fi

          RELEASE_TYPE="none"
          if echo "$COMMITS" | grep -qE "^[a-f0-9]+ (feat|feature)(\(.+\))?!:"; then
            RELEASE_TYPE="major"
          elif echo "$COMMITS" | grep -qE "^[a-f0-9]+ BREAKING CHANGE"; then
            RELEASE_TYPE="major"
          elif echo "$COMMITS" | grep -qE "^[a-f0-9]+ (feat|feature)(\(.+\))?:"; then
            RELEASE_TYPE="minor"
          elif echo "$COMMITS" | grep -qE "^[a-f0-9]+ (fix|bugfix|perf|refactor)(\(.+\))?:"; then
            RELEASE_TYPE="patch"
          fi

          if [ "$RELEASE_TYPE" != "none" ]; then
            emit mode propose
            emit release_type "$RELEASE_TYPE"
          else
            # A manually selected proposal may predate any conventional
            # feature/fix commit. Documentation-only advances still refresh it.
            for ref in $(git ls-remote --heads origin 'refs/heads/release/v*' | awk '{print $2}'); do
              tag="${ref#refs/heads/release/}"
              if [ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
                emit mode propose
                emit release_type existing
                exit 0
              fi
            done
            emit mode none
          fi

  # =============================================================================
  # Calculate Version
  # =============================================================================
  version:
    name: Calculate Version
    needs: check-release
    if: needs.check-release.outputs.mode == 'propose'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.proposal-version.outputs.new_version }}
      current_version: ${{ steps.proposal-version.outputs.current_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Calculate new version
        id: version
        if: needs.check-release.outputs.release_type != 'existing'
        env:
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          RELEASE_TYPE: ${{ needs.check-release.outputs.release_type }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: node scripts/ci/release-version.mjs

      - name: Reuse the active proposal version
        id: proposal-version
        env:
          CANDIDATE_VERSION: ${{ steps.version.outputs.new_version }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
          REUSE_OPEN_PROPOSAL: ${{ needs.check-release.outputs.release_type == 'existing' }}
        run: node scripts/ci/release-proposal.mjs select

  # =============================================================================
  # Generate Changelog
  # =============================================================================
  changelog:
    name: Generate Changelog
    needs: [check-release, version]
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Generate changelog
        id: changelog
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.new_version }}
        run: node scripts/ci/release-proposal.mjs notes

  # =============================================================================
  # Propose: version bump on a release branch, opened as a pull request
  # =============================================================================
  propose:
    name: Propose Release Pull Request
    needs: [check-release, version, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # All jobs use github.sha. An older queued run must never bind its notes
      # to newer main code. Only the managed notes block is regenerated; manual
      # notes outside it and every published changelog entry are preserved.
      - name: Prepare or refresh the release proposal
        id: proposal
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.new_version }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_NOTES: ${{ needs.changelog.outputs.changelog }}
        run: node scripts/ci/release-proposal.mjs prepare

      - name: Format release notes
        if: steps.proposal.outputs.skip != 'true'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec prettier --write CHANGELOG.md package.json

      # Rebuild from the recorded main tree, retaining the old proposal head as
      # a parent. The helper verifies the resulting delta and historical notes
      # before committing; a normal fast-forward push cannot discard edits.
      - name: Verify and commit the release proposal
        id: commit
        if: steps.proposal.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.new_version }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_PREVIOUS_HEAD: ${{ steps.proposal.outputs.previous_head }}
        run: node scripts/ci/release-proposal.mjs commit

      - name: Prepare the reviewed PR description
        id: body
        if: steps.proposal.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.new_version }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_BODY_FILE: ${{ runner.temp }}/release-pr.md
        run: node scripts/ci/release-proposal.mjs body

      - name: Push the verified proposal
        if: steps.proposal.outputs.skip != 'true'
        env:
          RELEASE_BRANCH: ${{ steps.proposal.outputs.branch }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_PREVIOUS_HEAD: ${{ steps.proposal.outputs.previous_head }}
          RELEASE_HEAD: ${{ steps.commit.outputs.head }}
        run: |
          set -euo pipefail
          current_main="$(git ls-remote --heads origin refs/heads/main | cut -f1)"
          current_head="$(git ls-remote --heads origin "refs/heads/$RELEASE_BRANCH" | cut -f1)"
          test "$current_main" = "$RELEASE_SOURCE_SHA" || { echo '::error::main advanced; a newer run must refresh the proposal.'; exit 1; }
          test "$current_head" = "$RELEASE_PREVIOUS_HEAD" || { echo '::error::The proposal changed concurrently; preserve it and retry.'; exit 1; }
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          test "$(git ls-remote --heads origin "refs/heads/$RELEASE_BRANCH" | cut -f1)" = "$RELEASE_HEAD"

      # Metadata is refreshed even when commit creation was already completed
      # by a previous interrupted run. Text outside the managed PR block stays.
      - name: Open or update the release pull request
        if: steps.proposal.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.new_version }}
          RELEASE_BRANCH: ${{ steps.proposal.outputs.branch }}
          RELEASE_HEAD: ${{ steps.commit.outputs.head }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_BODY_FILE: ${{ runner.temp }}/release-pr.md
        run: |
          set -euo pipefail
          # Read again just before editing so intervening reviewer prose stays.
          RELEASE_PR="$(node scripts/ci/release-proposal.mjs body --print-number)"
          test "$(git ls-remote --heads origin "refs/heads/$RELEASE_BRANCH" | cut -f1)" = "$RELEASE_HEAD"
          if [ -n "$RELEASE_PR" ]; then
            gh pr edit "$RELEASE_PR" --body-file "$RELEASE_BODY_FILE"
          else
            gh pr create --base main --head "$RELEASE_BRANCH" \
              --title "chore: release v$RELEASE_VERSION" --body-file "$RELEASE_BODY_FILE"
          fi

      # Token pushes need an explicit dispatch when no PR run starts. Filter by
      # the exact new head: a successful run on yesterday's head proves nothing
      # about a refreshed proposal. A repeated recovery does not duplicate runs.
      - name: Start the required checks on the release branch
        if: steps.proposal.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.proposal.outputs.branch }}
          RELEASE_HEAD: ${{ steps.commit.outputs.head }}
        run: |
          set -euo pipefail
          sleep 30
          for workflow in ci-cd.yml production-gates.yml component-labs.yml docker-image-validation.yml; do
            test "$(git ls-remote --heads origin "refs/heads/$RELEASE_BRANCH" | cut -f1)" = "$RELEASE_HEAD"
            started="$(RELEASE_WORKFLOW="$workflow" node scripts/ci/release-proposal.mjs checks)"
            if [ "$started" = "true" ]; then
              echo "$workflow already started for $RELEASE_HEAD"
              continue
            fi
            gh workflow run "$workflow" --ref "$RELEASE_BRANCH"
            echo "Started $workflow for $RELEASE_HEAD"
          done

  # =============================================================================
  # Publish: tag and release the merged release commit
  # =============================================================================
  release:
    name: Create Release
    needs: check-release
    if: needs.check-release.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Verifies the merged commit is a direct child of the recorded source,
      # changes only package.json and CHANGELOG.md, and bumps the version to
      # the tag. Reuses an existing tag if a previous publication was cut off.
      - name: Verify the merged release commit
        id: release-target
        env:
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.check-release.outputs.source_sha }}
          RELEASE_MERGED_SHA: ${{ github.sha }}
        run: |
          git fetch origin main --tags
          node scripts/ci/release-publication.js prepare

      - name: Read release notes from the changelog
        id: notes
        run: |
          set -euo pipefail
          {
            echo "notes<<EOF"
            awk 'BEGIN{p=0} /^## What.s Changed in /{ if (p) exit; p=1 } /^---$/{ if (p) exit } p{ print }' CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.release-target.outputs.tag_exists != 'true'
        env:
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
        run: |
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      # The proposal branch has done its job once the tag exists. Leaving it
      # would make the next proposal see an "open" release branch.
      - name: Delete the merged release branch
        env:
          RELEASE_BRANCH: release/${{ needs.check-release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$RELEASE_BRANCH"
          else
            echo "$RELEASE_BRANCH is already gone."
          fi

      - name: Create GitHub Release
        run: node scripts/ci/release-publication.js publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.check-release.outputs.source_sha }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
          # The reviewed version suffix persists prerelease selection across
          # proposal and merge; push runs do not have the dispatch inputs.
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}

      - name: Notify release
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ vars.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          retries: "0"
          payload: |
            {
              "text": "New Release Published",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*New Release: ${{ needs.check-release.outputs.tag }}* :rocket:\n\nView release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.check-release.outputs.tag }}"
                  }
                }
              ]
            }

  resume-publication:
    name: Resume Existing Release Publication
    if: github.event_name == 'workflow_dispatch' && inputs.resume_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Publish the verified existing tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.resume_tag }}
          RELEASE_EXPECTED_SHA: ${{ inputs.resume_commit }}
        run: node scripts/ci/release-publication.js resume

  # =============================================================================
  # Trigger Deployment (Optional)
  # An explicit DEPLOYMENT_PAT is required. Release publication must not fail
  # merely because optional deployment dispatch is intentionally unconfigured.
  # =============================================================================
  trigger-deployment:
    name: Trigger Deployment
    needs: [check-release, release]
    runs-on: ubuntu-latest
    if: needs.check-release.outputs.mode == 'publish' && !contains(needs.check-release.outputs.tag, '-')
    steps:
      - name: Detect deployment credential
        id: deployment-credential
        env:
          DEPLOYMENT_PAT: ${{ secrets.DEPLOYMENT_PAT }}
        run: |
          if [ -n "$DEPLOYMENT_PAT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Automatic deployment trigger is not configured; release publication remains successful."
          fi

      # Dispatch a workflow that consumes the requested immutable tag. A bare
      # repository_dispatch has no consumer in this repository. The PAT needs
      # Actions: write; the consumer re-verifies the published stable release.
      - name: Trigger deployment workflow
        if: steps.deployment-credential.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_PAT }}
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh workflow run ci-cd.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" \
            --raw-field release_tag="$RELEASE_TAG" \
            --raw-field release_commit="$RELEASE_COMMIT"
