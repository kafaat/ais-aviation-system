name: Release Automation

# Two phases, both driven from main.
#
# 1. Propose: when main carries releasable commits (or on a manual dispatch),
#    the version bump and changelog are committed to a `release/vX.Y.Z` branch
#    and opened as a pull request. Nothing is pushed to main. Because the
#    branch and the pull request are created with GITHUB_TOKEN, GitHub starts
#    no workflow for them on its own; the required check workflows are started
#    explicitly with workflow_dispatch on the release branch, which the token
#    is allowed to do. The pull request then needs the same review and checks
#    as any other change.
#
# 2. Publish: when the tip of main is a merged release commit (only
#    package.json and CHANGELOG.md changed, version bumped, tag absent), the
#    tag and the GitHub release are created from that exact commit.
#
# This is what lets the main ruleset be enforced: no commit reaches main
# without a pull request, including the release bot's.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (patch, minor, major)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Create as prerelease"
        required: false
        default: false
        type: boolean
      custom_version:
        description: "Custom version (leave empty to auto-increment)"
        required: false
        type: string
      resume_tag:
        description: "Publish an existing tag without another version bump (optional)"
        required: false
        type: string
      resume_commit:
        description: "Exact 40-character commit for resume_tag"
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  NODE_VERSION: "22.x"

jobs:
  # =============================================================================
  # Decide: publish a merged release commit, propose a new one, or nothing
  # =============================================================================
  check-release:
    name: Check Release Conditions
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      release_type: ${{ steps.check.outputs.release_type }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      source_sha: ${{ steps.check.outputs.source_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Classify the trigger
        id: check
        env:
          RESUME_TAG: ${{ inputs.resume_tag }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          emit release_type none; emit tag ""; emit version ""; emit source_sha ""

          if [ -n "$RESUME_TAG" ]; then
            emit mode none
            exit 0
          fi

          # A merged release commit at the tip of main: publish it. The commit
          # is recognised by its content, never by its message, and the
          # publisher re-verifies the same facts before tagging.
          if [ "$EVENT_NAME" = "push" ]; then
            parent="$(git rev-parse HEAD^)"
            changed="$(git diff --name-only "$parent" HEAD)"
            unexpected="$(printf '%s\n' "$changed" | grep -vxE 'CHANGELOG\.md|package\.json' || true)"
            before="$(git show "$parent:package.json" | jq -r '.version')"
            after="$(jq -r '.version' package.json)"
            if [ -z "$unexpected" ] && printf '%s\n' "$changed" | grep -qx 'package.json' && [ "$before" != "$after" ]; then
              tag="v$after"
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                echo "::notice::$tag already exists; nothing to publish."
                emit mode none
                exit 0
              fi
              emit mode publish
              emit tag "$tag"
              emit version "$after"
              emit source_sha "$parent"
              exit 0
            fi
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            emit mode propose
            emit release_type "$INPUT_RELEASE_TYPE"
            exit 0
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline)
          fi

          RELEASE_TYPE="none"
          if echo "$COMMITS" | grep -qE "^[a-f0-9]+ (feat|feature)(\(.+\))?!:"; then
            RELEASE_TYPE="major"
          elif echo "$COMMITS" | grep -qE "^[a-f0-9]+ BREAKING CHANGE"; then
            RELEASE_TYPE="major"
          elif echo "$COMMITS" | grep -qE "^[a-f0-9]+ (feat|feature)(\(.+\))?:"; then
            RELEASE_TYPE="minor"
          elif echo "$COMMITS" | grep -qE "^[a-f0-9]+ (fix|bugfix|perf|refactor)(\(.+\))?:"; then
            RELEASE_TYPE="patch"
          fi

          if [ "$RELEASE_TYPE" != "none" ]; then
            emit mode propose
            emit release_type "$RELEASE_TYPE"
          else
            emit mode none
          fi

  # =============================================================================
  # Calculate Version
  # =============================================================================
  version:
    name: Calculate Version
    needs: check-release
    if: needs.check-release.outputs.mode == 'propose'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      current_version: ${{ steps.version.outputs.current_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Calculate new version
        id: version
        env:
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if [ -n "$CUSTOM_VERSION" ]; then
            if ! [[ "$CUSTOM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
              echo "::error::Invalid custom version"
              exit 1
            fi
            NEW_VERSION="$CUSTOM_VERSION"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3 | cut -d- -f1)
          RELEASE_TYPE="${{ needs.check-release.outputs.release_type }}"

          case $RELEASE_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            NEW_VERSION="${NEW_VERSION}-rc.$(date +%Y%m%d%H%M)"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

  # =============================================================================
  # Generate Changelog
  # =============================================================================
  changelog:
    name: Generate Changelog
    needs: [check-release, version]
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi

          FEATURES=$(echo "$COMMITS" | grep -E "^- (feat|feature)" || true)
          FIXES=$(echo "$COMMITS" | grep -E "^- (fix|bugfix)" || true)
          PERF=$(echo "$COMMITS" | grep -E "^- perf" || true)
          DOCS=$(echo "$COMMITS" | grep -E "^- docs" || true)
          CHORE=$(echo "$COMMITS" | grep -E "^- (chore|build|ci)" || true)
          REFACTOR=$(echo "$COMMITS" | grep -E "^- refactor" || true)
          OTHER=$(echo "$COMMITS" | grep -vE "^- (feat|feature|fix|bugfix|perf|docs|chore|build|ci|refactor)" || true)

          CHANGELOG="## What's Changed in v${{ needs.version.outputs.new_version }}\n\n"
          if [ -n "$FEATURES" ]; then CHANGELOG+="### Features\n$FEATURES\n\n"; fi
          if [ -n "$FIXES" ]; then CHANGELOG+="### Bug Fixes\n$FIXES\n\n"; fi
          if [ -n "$PERF" ]; then CHANGELOG+="### Performance Improvements\n$PERF\n\n"; fi
          if [ -n "$REFACTOR" ]; then CHANGELOG+="### Code Refactoring\n$REFACTOR\n\n"; fi
          if [ -n "$DOCS" ]; then CHANGELOG+="### Documentation\n$DOCS\n\n"; fi
          if [ -n "$CHORE" ]; then CHANGELOG+="### Maintenance\n$CHORE\n\n"; fi
          if [ -n "$OTHER" ]; then CHANGELOG+="### Other Changes\n$OTHER\n\n"; fi
          if [ -n "$LAST_TAG" ]; then
            CHANGELOG+="\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...v${{ needs.version.outputs.new_version }}"
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # =============================================================================
  # Propose: version bump on a release branch, opened as a pull request
  # =============================================================================
  propose:
    name: Propose Release Pull Request
    needs: [check-release, version, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # One release proposal at a time. A second bump while one is open would
      # produce two competing version commits; the operator closes or merges
      # the open one first.
      - name: Refuse a duplicate proposal
        id: guard
        env:
          RELEASE_TAG: v${{ needs.version.outputs.new_version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::$RELEASE_TAG already exists; use resume_tag to publish it."
            exit 1
          fi
          open="$(git ls-remote --heads origin 'refs/heads/release/v*' | awk '{print $2}' || true)"
          if [ -n "$open" ]; then
            echo "::notice::A release branch is already open: $open. Merge or delete it before proposing another."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version in package.json
        if: steps.guard.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts

      - name: Update CHANGELOG.md
        if: steps.guard.outputs.skip != 'true'
        env:
          RELEASE_NOTES: ${{ needs.changelog.outputs.changelog }}
        run: |
          NEW_CHANGELOG="# Changelog\n\n${RELEASE_NOTES}\n\n"
          if [ -f CHANGELOG.md ]; then
            EXISTING=$(tail -n +3 CHANGELOG.md)
            echo -e "$NEW_CHANGELOG\n---\n\n$EXISTING" > CHANGELOG.md
          else
            echo -e "$NEW_CHANGELOG" > CHANGELOG.md
          fi

      - name: Format CHANGELOG.md with Prettier
        if: steps.guard.outputs.skip != 'true'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec prettier --write CHANGELOG.md

      - name: Commit version bump
        if: steps.guard.outputs.skip != 'true'
        run: |
          git add package.json CHANGELOG.md
          git commit -m "chore(release): v${{ needs.version.outputs.new_version }}"

      # The release commit is reviewed like any other, but its whole point is
      # to carry nothing except the version bump and changelog. Prove that
      # before it leaves this runner; the publisher proves it again on main.
      - name: Verify the release commit changes no code
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only HEAD~1 HEAD | grep -vxE 'CHANGELOG\.md|package\.json' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Release commit touches files other than CHANGELOG.md and package.json:"
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if ! diff <(git show HEAD~1:package.json | jq -S 'del(.version)') \
                    <(jq -S 'del(.version)' package.json) > /dev/null; then
            echo "::error::Release commit changes package.json beyond its version field."
            git --no-pager diff HEAD~1 HEAD -- package.json >&2
            exit 1
          fi
          echo "Release commit is limited to the version bump and changelog."

      - name: Push version bump
        if: steps.guard.outputs.skip != 'true'
        env:
          RELEASE_BRANCH: release/v${{ needs.version.outputs.new_version }}
        run: git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

      # The title carries no `release` scope on purpose: the PR title check
      # rejects that scope. The squash commit on main is recognised by its
      # content, so the title does not need to match a pattern.
      - name: Open the release pull request
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.new_version }}
          RELEASE_BRANCH: release/v${{ needs.version.outputs.new_version }}
          RELEASE_NOTES: ${{ needs.changelog.outputs.changelog }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          {
            echo "## Description"
            echo
            echo "Version bump to v$RELEASE_VERSION and its changelog entry. This pull request changes only \`package.json\` and \`CHANGELOG.md\`; the tag and the GitHub release are created from the merge commit once it reaches \`main\`."
            echo
            echo "## Type of Change"
            echo
            echo "- [x] Other (please describe): release version bump"
            echo
            echo "## Related Issues"
            echo
            echo "Release proposal generated by the Release Automation workflow."
            echo
            echo "## How to Test"
            echo
            echo "1. The required checks run on this branch; they were started by the workflow because a token-created branch starts none on its own."
            echo "2. \`git diff --name-only main...HEAD\` lists only \`package.json\` and \`CHANGELOG.md\`."
            echo "3. After merge, the Release Automation workflow publishes \`v$RELEASE_VERSION\` from the merge commit."
            echo
            echo "## Checklist"
            echo
            echo "- [x] My code follows the project's code style"
            echo "- [x] I have performed a self-review of my changes"
            echo "- [x] I have added tests that prove my fix/feature works — not applicable, version bump only"
            echo "- [x] New and existing unit tests pass locally — verified by the checks on this branch"
            echo "- [x] I have updated the documentation accordingly — changelog"
            echo "- [x] My changes generate no new warnings"
            echo "- [x] I have checked for potential security issues — no code changes"
            echo
            echo "## Additional Notes"
            echo
            echo "$RELEASE_NOTES"
          } > "$body_file"
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "chore: release v$RELEASE_VERSION" \
            --body-file "$body_file"

      # A branch pushed with GITHUB_TOKEN triggers no workflow, so the checks
      # the ruleset requires must be started explicitly. workflow_dispatch is
      # the one event that token may raise. The check runs attach to the
      # branch head, which is the pull request head.
      - name: Start the required checks on the release branch
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: release/v${{ needs.version.outputs.new_version }}
        run: |
          set -euo pipefail
          for workflow in ci-cd.yml production-gates.yml component-labs.yml docker-image-validation.yml; do
            gh workflow run "$workflow" --ref "$RELEASE_BRANCH"
            echo "Started $workflow on $RELEASE_BRANCH"
          done

  # =============================================================================
  # Publish: tag and release the merged release commit
  # =============================================================================
  release:
    name: Create Release
    needs: check-release
    if: needs.check-release.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Verifies the merged commit is a direct child of the recorded source,
      # changes only package.json and CHANGELOG.md, and bumps the version to
      # the tag. Reuses an existing tag if a previous publication was cut off.
      - name: Verify the merged release commit
        id: release-target
        env:
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.check-release.outputs.source_sha }}
          RELEASE_MERGED_SHA: ${{ github.sha }}
        run: |
          git fetch origin main --tags
          node scripts/ci/release-publication.js prepare

      - name: Read release notes from the changelog
        id: notes
        run: |
          set -euo pipefail
          {
            echo "notes<<EOF"
            awk 'BEGIN{p=0} /^## What.s Changed in /{ if (p) exit; p=1 } /^---$/{ if (p) exit } p{ print }' CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.release-target.outputs.tag_exists != 'true'
        env:
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
        run: |
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        run: node scripts/ci/release-publication.js publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.check-release.outputs.source_sha }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
          # Empty on a push, where the tag suffix decides. On a dispatch the
          # operator's choice must reach the release, including a custom
          # version, which never receives the -rc suffix.
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}

      - name: Notify release
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "text": "New Release Published",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*New Release: ${{ needs.check-release.outputs.tag }}* :rocket:\n\nView release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.check-release.outputs.tag }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  resume-publication:
    name: Resume Existing Release Publication
    if: github.event_name == 'workflow_dispatch' && inputs.resume_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Publish the verified existing tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.resume_tag }}
          RELEASE_EXPECTED_SHA: ${{ inputs.resume_commit }}
        run: node scripts/ci/release-publication.js resume

  # =============================================================================
  # Trigger Deployment (Optional)
  # An explicit DEPLOYMENT_PAT is required. Release publication must not fail
  # merely because optional deployment dispatch is intentionally unconfigured.
  # =============================================================================
  trigger-deployment:
    name: Trigger Deployment
    needs: [check-release, release]
    runs-on: ubuntu-latest
    if: needs.check-release.outputs.mode == 'publish' && !contains(needs.check-release.outputs.tag, '-')
    steps:
      - name: Detect deployment credential
        id: deployment-credential
        env:
          DEPLOYMENT_PAT: ${{ secrets.DEPLOYMENT_PAT }}
        run: |
          if [ -n "$DEPLOYMENT_PAT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Automatic deployment trigger is not configured; release publication remains successful."
          fi

      - name: Trigger deployment workflow
        if: steps.deployment-credential.outputs.configured == 'true'
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.DEPLOYMENT_PAT }}
          event-type: release-deployment
          client-payload: '{"version": "${{ needs.check-release.outputs.version }}", "ref": "${{ needs.check-release.outputs.tag }}"}'
