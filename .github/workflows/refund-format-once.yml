name: Refund format once

on:
  push:
    branches:
      - fix/refund-cumulative-idempotency-20260907

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/refund-cumulative-idempotency-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write server/services/refunds.service.ts server/services/refunds.security.test.ts
      - name: Commit exact formatting
        run: |
          if git diff --quiet -- server/services/refunds.service.ts server/services/refunds.security.test.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/services/refunds.service.ts server/services/refunds.security.test.ts
          git commit -m "style(refunds): apply repository prettier"
          git push origin HEAD:fix/refund-cumulative-idempotency-20260907
