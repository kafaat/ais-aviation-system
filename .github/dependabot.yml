version: 2

# Keep routine upgrades reviewable. Security updates remain enabled in repository
# settings and every pull request must pass the normal protected-branch checks.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
    groups:
      npm-compatible:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /auth-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
    groups:
      auth-compatible:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /scripts/contracts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
    groups:
      contracts-compatible:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(ci)
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
