# Keep every default detector. Exempt only the complete, known synthetic value:
# a fixture must never hide a different credential on the same line.
# scripts/ci/probe-gitleaks-policy.py exercises the real scanner in CI.
[extend]
useDefault = true

[allowlist]
description = "Exact synthetic fixture values"
regexTarget = "secret"
regexes = [
  '''^split-refund-1$''',
  '''^sk_test_123456789$''',
]
