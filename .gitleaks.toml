# Keep every default detector. Exempt only the complete, known synthetic value:
# a fixture must never hide a different credential on the same line.
# scripts/ci/probe-gitleaks-policy.py exercises the real scanner in CI.
[extend]
useDefault = true

[allowlist]
description = "Exact synthetic fixture values"
regexTarget = "secret"
regexes = [
  '''^split-refund-1$''',
  '''^sk_test_123456789$''',
]

# These values were verified against the three public build assets recorded by
# this exact receipt. Keep the original detector; exempt neither a whole file
# nor arbitrary digests, including after the branch is squash-merged.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Three verified public build digests in the native acceptance receipt"
condition = "AND"
regexTarget = "secret"
paths = ['''^docs/audits/ui-service-connectivity-20261105/evidence/native/attempt2/source-binding\.json$''']
regexes = [
  '''^8453d7c793977453dbcc86f016d86aae87bf31d5adaa2e6a88bc756d640a45db$''',
  '''^13bacc1b352f6c25db5e63b5552657a881e1da77aab1c1e012a2d8f86945accc$''',
  '''^22fb6548cfa0b79f593e335da6c475a3d9228079d78eeb4f4e8e32e71be41b55$''',
]
